<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Fantasy Track</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* AJUSTES VISUALES ADMIN */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
        }

        .admin-container {
            padding-top: 130px !important;
            padding-bottom: 100px !important;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%; z-index: 1000;
            background: #000; border-bottom: 2px solid var(--primary);
        }

        /* Inputs específicos de Admin */
        select, input {
            background: #111 !important;
            color: white !important;
            border: 1px solid #555 !important;
        }

        /* Estilo para el input de resultado en la lista */
        .result-input {
            background: #000 !important;
            border: 1px solid var(--primary) !important;
            color: #4cd137 !important;
            width: 100px;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo" style="color: #ff5e00; padding-left: 20px;">
            <i class="fa-solid fa-user-secret"></i> ZONA <span>ADMIN</span>
        </div>
        <div class="nav-links" style="padding-right: 20px;">
            <a href="../docs/home.html" style="background: rgba(255,255,255,0.1); border-radius: 20px; padding: 8px 15px; color: white; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Web
            </a>
        </div>
    </nav>

    <div class="admin-container">
        
        <div class="admin-section">
            <h2><i class="fa-solid fa-person-running"></i> Gestión de Atletas</h2>
            
            <div class="edit-controls">
                <div style="flex-grow: 1; width: 100%;">
                    <label>Editar atleta existente:</label>
                    <select id="selectorEditarAtleta">
                        <option value="">Cargando lista...</option>
                    </select>
                </div>
                <button type="button" id="btnCargarAtleta" class="btn-action" style="width: auto; margin: 0; background: #333;">
                    <i class="fa-solid fa-pen-to-square"></i> Cargar
                </button>
            </div>

            <form id="formAtleta">
                <input type="hidden" id="atletaIdHidden">
                <input type="hidden" id="fotoActualHidden"> 

                <div class="form-grid">
                    <div>
                        <label>Nombre</label>
                        <input type="text" id="atlNombre" required placeholder="Ej: Ana">
                    </div>
                    <div>
                        <label>Apellidos</label>
                        <input type="text" id="atlApellidos" required placeholder="Ej: Peleteiro">
                    </div>
                    <div>
                        <label>Categoría</label>
                        <select id="atlCategoria" required>
                            <option value="Velocidad">Velocidad</option>
                            <option value="Medio Fondo">Medio Fondo</option>
                            <option value="Fondo">Fondo</option>
                            <option value="Saltos">Saltos</option>
                            <option value="Lanzamientos">Lanzamientos</option>
                            <option value="Marcha">Marcha</option>
                            <option value="Combinadas">Combinadas</option>
                        </select>
                    </div>
                    <div>
                        <label>Precio (Valor en M)</label>
                        <input type="number" id="atlPrecio" required placeholder="Ej: 90">
                    </div>
                    <div class="full-width">
                        <label>Pruebas Principales (Máx 2, separadas por coma)</label>
                        <input type="text" id="atlPruebas" placeholder="Ej: 100m, 200m">
                    </div>
                    <div>
                        <label>Categoría Marcas (Nivel)</label>
                        <select id="atlCatMarcas">
                            <option value="Elite Mundial">Elite Mundial</option>
                            <option value="Internacional">Internacional</option>
                            <option value="Nacional Top">Nacional Top</option>
                            <option value="Promesa">Promesa</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <label><i class="fa-regular fa-image"></i> Foto (Debe estar en carpeta /images)</label>
                        <div style="background: #222; padding: 10px; border: 1px dashed #555; border-radius: 5px;">
                            <input type="file" id="atlFotoInput" accept="image/*">
                            <p style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">
                                Ruta generada: <span id="rutaPreview" style="color: #ff5e00; font-family: monospace;">../images/???</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" id="btnSubmitAtleta" class="btn-action">CREAR ATLETA</button>
                    <button type="button" id="btnCancelarEdicion" class="btn-action btn-secondary" style="display:none; background: #666;">CANCELAR</button>
                </div>
            </form>
        </div>

        <div class="admin-section">
            <h2><i class="fa-solid fa-trophy"></i> Gestión de Competiciones</h2>
            
            <div class="edit-controls" style="border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px;">
                <div style="flex-grow: 1; width: 100%;">
                    <label>Editar competición existente:</label>
                    <select id="selectorEditarCompe">
                        <option value="">Cargando lista...</option>
                    </select>
                </div>
                <button type="button" id="btnCargarCompe" class="btn-action" style="width: auto; margin: 0; background: #333;">
                    <i class="fa-solid fa-pen-to-square"></i> Cargar
                </button>
            </div>

            <form id="formCompe">
                <input type="hidden" id="compeIdHidden"> <div class="form-grid">
                    <div class="full-width">
                        <label>Nombre Competición</label>
                        <input type="text" id="compNombre" required placeholder="Ej: Diamond League Paris">
                    </div>
                    <div>
                        <label>Fecha</label>
                        <input type="date" id="compFecha" required>
                    </div>
                    <div>
                        <label>Lugar</label>
                        <input type="text" id="compLugar" required placeholder="Ej: Paris, Francia">
                    </div>
                    <div class="full-width">
                        <label>Estado</label>
                        <select id="compEstado">
                            <option value="pendiente">Pendiente (Aún no se ha disputado)</option>
                            <option value="finalizada">Finalizada (Ya hay resultados)</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <label>Pruebas Disponibles (Texto)</label>
                        <input type="text" id="compPruebasTexto" placeholder="Ej: 100m, 400mV...">
                    </div>
                    <div class="full-width">
                        <label>Links (Resultados/Streaming)</label>
                        <input type="text" id="compLinks" placeholder="http://...">
                    </div>
                </div>

                <hr style="border-color: #333; margin: 30px 0;">
                
                <h3 style="color:white; font-size: 1.1rem; margin-bottom: 15px;">
                    Participantes y Resultados
                </h3>
                
                <div class="form-grid" style="align-items: end; background: #222; padding: 15px; border-radius: 8px;">
                    <div class="full-width">
                        <label>Añadir Atleta</label>
                        <select id="selectorAtletasLineup">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label>Prueba</label>
                        <input type="text" id="inputPruebaEspecifica" placeholder="Ej: 100m">
                    </div>
                    <div>
                        <button type="button" id="btnAddLineup" class="btn-action" style="margin: 0; background: #444;">
                            + AÑADIR
                        </button>
                    </div>
                </div>

                <div id="listaVisual" class="lineup-box">
                    <p style="color: #666; text-align: center;">Lista vacía.</p>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" id="btnSubmitCompe" class="btn-action">CREAR COMPETICIÓN</button>
                    <button type="button" id="btnCancelarCompe" class="btn-action btn-secondary" style="display:none; background: #666;">CANCELAR</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "../js/firebase-config.js";
        import { collection, addDoc, getDocs, orderBy, query, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // === 1. SEGURIDAD ===
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);
                const userData = docSnap.exists() ? docSnap.data() : null;
                const esAdmin = (userData && userData.rol === "admin");

                if (esAdmin) {
                    console.log("Acceso Admin concedido.");
                    cargarSelectoresAtletas();
                    cargarSelectorCompes(); // Nueva función
                } else {
                    document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:150px;'>⛔ ACCESO DENEGADO</h1>";
                    setTimeout(() => window.location.href = "../docs/home.html", 1500);
                }
            } else {
                window.location.href = "../index.html";
            }
        });

        // VARIABLES GLOBALES
        let listaParticipantes = []; 

        // ==========================================
        // FUNCIONES DE CARGA (SELECTORES)
        // ==========================================
        async function cargarSelectoresAtletas() {
            const selEdit = document.getElementById('selectorEditarAtleta');
            const selLineup = document.getElementById('selectorAtletasLineup');
            selEdit.innerHTML = '<option>Cargando...</option>';

            try {
                const q = query(collection(db, "atletas"), orderBy("nombre"));
                const querySnapshot = await getDocs(q);
                let html = '<option value="">-- Selecciona Atleta --</option>';

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const safeData = JSON.stringify(data).replace(/"/g, '&quot;');
                    html += `<option value="${doc.id}" data-info="${safeData}">${data.nombre} ${data.apellidos}</option>`;
                });
                selEdit.innerHTML = html;
                selLineup.innerHTML = html;
            } catch (error) { console.error(error); }
        }

        async function cargarSelectorCompes() {
            const selCompe = document.getElementById('selectorEditarCompe');
            selCompe.innerHTML = '<option>Cargando...</option>';

            try {
                // Ordenar por fecha descendente (las más nuevas primero)
                const q = query(collection(db, "competiciones"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                let html = '<option value="">-- Selecciona para Editar --</option>';

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Guardamos TODA la data en el option para recuperarla rápido
                    // Cuidado con las comillas en los JSON
                    const safeData = JSON.stringify(data).replace(/"/g, '&quot;');
                    html += `<option value="${doc.id}" data-info="${safeData}">${data.fecha} - ${data.nombre}</option>`;
                });
                selCompe.innerHTML = html;
            } catch (error) { console.error(error); }
        }

        // ==========================================
        // GESTIÓN DE ATLETAS (IGUAL QUE ANTES)
        // ==========================================
        document.getElementById('atlFotoInput').addEventListener('change', function() {
            if(this.files && this.files[0]) document.getElementById('rutaPreview').innerText = "../images/" + this.files[0].name;
        });

        document.getElementById('btnCargarAtleta').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarAtleta');
            const id = select.value;
            if(!id) return alert("Selecciona atleta");

            const option = select.options[select.selectedIndex];
            const data = JSON.parse(option.getAttribute('data-info'));

            document.getElementById('atletaIdHidden').value = id;
            document.getElementById('atlNombre').value = data.nombre;
            document.getElementById('atlApellidos').value = data.apellidos;
            document.getElementById('atlCategoria').value = data.categoria;
            document.getElementById('atlPrecio').value = data.precio;
            document.getElementById('atlPruebas').value = data.pruebas_principales || "";
            document.getElementById('atlCatMarcas').value = data.cat_marcas || "Internacional";
            document.getElementById('fotoActualHidden').value = data.foto;
            document.getElementById('rutaPreview').innerText = data.foto || "Sin foto";

            const btn = document.getElementById('btnSubmitAtleta');
            btn.innerText = "ACTUALIZAR ATLETA";
            btn.style.background = "#ffae00"; btn.style.color = "black";
            document.getElementById('btnCancelarEdicion').style.display = 'block';
        });

        document.getElementById('btnCancelarEdicion').addEventListener('click', () => {
            document.getElementById('formAtleta').reset();
            document.getElementById('atletaIdHidden').value = "";
            const btn = document.getElementById('btnSubmitAtleta');
            btn.innerText = "CREAR ATLETA";
            btn.style.background = "#ff5e00"; btn.style.color = "white";
            document.getElementById('btnCancelarEdicion').style.display = 'none';
        });

        document.getElementById('formAtleta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitAtleta');
            btn.disabled = true; 
            const id = document.getElementById('atletaIdHidden').value;
            const fileInput = document.getElementById('atlFotoInput');
            let rutaFoto = id ? document.getElementById('fotoActualHidden').value : "https://cdn-icons-png.flaticon.com/512/74/74472.png";
            if (fileInput.files.length > 0) rutaFoto = "../images/" + fileInput.files[0].name;

            const datos = {
                nombre: document.getElementById('atlNombre').value,
                apellidos: document.getElementById('atlApellidos').value,
                categoria: document.getElementById('atlCategoria').value,
                precio: Number(document.getElementById('atlPrecio').value),
                pruebas_principales: document.getElementById('atlPruebas').value,
                cat_marcas: document.getElementById('atlCatMarcas').value,
                foto: rutaFoto
            };

            try {
                if(id) { await updateDoc(doc(db, "atletas", id), datos); alert("Actualizado!"); }
                else { datos.puntos = 0; datos.tendencia = "neutral"; await addDoc(collection(db, "atletas"), datos); alert("Creado!"); }
                document.getElementById('btnCancelarEdicion').click();
                cargarSelectoresAtletas();
            } catch(e) { alert("Error: " + e.message); }
            btn.disabled = false;
        });

        // ==========================================
        // GESTIÓN DE COMPETICIONES (NUEVO)
        // ==========================================

        // 1. CARGAR DATOS PARA EDITAR
        document.getElementById('btnCargarCompe').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarCompe');
            const id = select.value;
            if(!id) return alert("Selecciona competición");

            const option = select.options[select.selectedIndex];
            const data = JSON.parse(option.getAttribute('data-info'));

            // Rellenar campos
            document.getElementById('compeIdHidden').value = id;
            document.getElementById('compNombre').value = data.nombre;
            document.getElementById('compFecha').value = data.fecha;
            document.getElementById('compLugar').value = data.lugar;
            document.getElementById('compEstado').value = data.estado || "pendiente";
            document.getElementById('compPruebasTexto').value = data.pruebas_resumen || "";
            document.getElementById('compLinks').value = data.links || "";

            // Cargar participantes en memoria y pintar
            listaParticipantes = data.participantes || [];
            actualizarVisualCompe();

            // Cambiar Botones
            const btn = document.getElementById('btnSubmitCompe');
            btn.innerText = "ACTUALIZAR COMPETICIÓN";
            btn.style.background = "#ffae00"; btn.style.color = "black";
            document.getElementById('btnCancelarCompe').style.display = 'block';
        });

        document.getElementById('btnCancelarCompe').addEventListener('click', () => {
            document.getElementById('formCompe').reset();
            document.getElementById('compeIdHidden').value = "";
            listaParticipantes = [];
            actualizarVisualCompe();
            
            const btn = document.getElementById('btnSubmitCompe');
            btn.innerText = "CREAR COMPETICIÓN";
            btn.style.background = "#ff5e00"; btn.style.color = "white";
            document.getElementById('btnCancelarCompe').style.display = 'none';
        });

        // 2. AÑADIR ATLETA AL LINEUP
        document.getElementById('btnAddLineup').addEventListener('click', () => {
            const selector = document.getElementById('selectorAtletasLineup');
            const inputPrueba = document.getElementById('inputPruebaEspecifica');
            const idAtleta = selector.value;
            
            if (!idAtleta || !inputPrueba.value) return alert("Faltan datos");
            
            const nombreAtleta = selector.options[selector.selectedIndex].text.trim();
            
            listaParticipantes.push({
                id_atleta: idAtleta,
                nombre_completo: nombreAtleta,
                prueba: inputPrueba.value,
                resultado: "" // Inicialmente vacío
            });

            actualizarVisualCompe();
            inputPrueba.value = "";
        });

        // 3. PINTAR LISTA VISUAL (Con Input de Resultado)
        function actualizarVisualCompe() {
            const container = document.getElementById('listaVisual');
            container.innerHTML = listaParticipantes.length ? "" : '<p style="color: #666; text-align: center;">Lista vacía.</p>';
            
            listaParticipantes.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lineup-item';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.gap = '10px';
                
                // Aquí está la magia: Input de texto para el resultado
                div.innerHTML = `
                    <div style="flex-grow:1;">
                        <strong>${item.nombre_completo}</strong> 
                        <span style="color:#aaa; font-size:0.8rem;">(${item.prueba})</span>
                    </div>
                    <input type="text" 
                           class="result-input" 
                           placeholder="Resultado..." 
                           value="${item.resultado || ''}" 
                           onchange="actualizarResultado(${index}, this.value)">
                    <i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="borrarDelLineup(${index})"></i>
                `;
                container.appendChild(div);
            });
        }

        // FUNCIONES GLOBALES PARA EL HTML
        window.actualizarResultado = (index, valor) => {
            listaParticipantes[index].resultado = valor;
        };

        window.borrarDelLineup = (index) => {
            listaParticipantes.splice(index, 1);
            actualizarVisualCompe();
        };

        // 4. GUARDAR / ACTUALIZAR COMPETICIÓN
        document.getElementById('formCompe').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (listaParticipantes.length === 0 && !confirm("¿Guardar sin atletas?")) return;

            const btn = document.getElementById('btnSubmitCompe');
            btn.disabled = true;
            const id = document.getElementById('compeIdHidden').value;

            const datos = {
                nombre: document.getElementById('compNombre').value,
                fecha: document.getElementById('compFecha').value,
                lugar: document.getElementById('compLugar').value,
                estado: document.getElementById('compEstado').value,
                pruebas_resumen: document.getElementById('compPruebasTexto').value,
                links: document.getElementById('compLinks').value,
                participantes: listaParticipantes // Se guarda con los resultados escritos
            };

            try {
                if(id) {
                    await updateDoc(doc(db, "competiciones", id), datos);
                    alert("✅ Competición actualizada");
                } else {
                    await addDoc(collection(db, "competiciones"), datos);
                    alert("✅ Competición creada");
                }
                
                document.getElementById('btnCancelarCompe').click();
                cargarSelectorCompes(); // Recargar lista

            } catch (error) {
                alert("Error: " + error.message);
            }
            btn.disabled = false;
        });

    </script>
</body>
</html>
