<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL | Fantasy Atletismo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #111; color: white; }
        .admin-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 40px auto; padding: 20px; }
        
        .admin-card { background: #222; padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .card-header { color: #ff5e00; text-align: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        label { display: block; margin-top: 10px; font-size: 0.9rem; color: #ccc; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
        
        button.action-btn { width: 100%; padding: 12px; margin-top: 20px; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .btn-create { background: #00c851; color: white; }
        .btn-create:hover { background: #007e33; }
        
        .btn-add-lineup { background: #ff5e00; color: white; margin-top: 10px; }
        .btn-add-lineup:hover { background: #cc4b00; }

        /* Estilos para la lista de atletas en la competición */
        .lineup-box { background: #1a1a1a; padding: 10px; margin-top: 15px; border-radius: 8px; min-height: 100px; border: 1px dashed #555; }
        .lineup-item { display: flex; justify-content: space-between; background: #333; padding: 5px 10px; margin-bottom: 5px; border-radius: 4px; font-size: 0.85rem; }
        .lineup-item span { color: #ff5e00; }

        @media (max-width: 768px) { .admin-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-top: 20px;">PANEL DE CONTROL 🛠️</h1>

    <div class="admin-layout">
        
        <div class="admin-card">
            <h2 class="card-header">🏃‍♂️ NUEVO ATLETA</h2>
            <form id="formAtleta">
                <label>Nombre</label>
                <input type="text" id="atlNombre" placeholder="Ej: Ana" required>
                
                <label>Apellidos</label>
                <input type="text" id="atlApellidos" placeholder="Ej: Peleteiro" required>

                <label>Categoría</label>
                <select id="atlCategoria">
                    <option value="Absoluto">Absoluto</option>
                    <option value="Sub-23">Sub-23</option>
                    <option value="Sub-20">Sub-20</option>
                    <option value="Sub-18">Sub-18</option>
                    <option value="Master">Master</option>
                </select>

                <label>Precio Inicial (€)</label>
                <input type="number" id="atlPrecio" placeholder="50000" required>

                <label>URL Foto (Opcional)</label>
                <input type="text" id="atlFoto" placeholder="https://...">

                <button type="submit" class="action-btn btn-create">GUARDAR ATLETA</button>
            </form>
        </div>

        <div class="admin-card">
            <h2 class="card-header">🏆 NUEVA COMPETICIÓN</h2>
            <form id="formCompe">
                <label>Nombre Competición</label>
                <input type="text" id="compNombre" placeholder="Ej: Cto. de Madrid Absoluto" required>

                <label>Lugar</label>
                <input type="text" id="compLugar" placeholder="Ej: Vallehermoso" required>

                <label>Fecha</label>
                <input type="date" id="compFecha" required>

                <label>Pruebas (Resumen)</label>
                <input type="text" id="compPruebasTexto" placeholder="Ej: Velocidad, Saltos y Relevos">

                <div style="border-top: 1px solid #444; margin-top: 20px; padding-top: 10px;">
                    <label style="color: #ff5e00;">Añadir Atletas a la Start List:</label>
                    
                    <select id="selectorAtletasBD">
                        <option value="">Cargando atletas...</option>
                    </select>

                    <input type="text" id="inputPruebaEspecifica" placeholder="¿Qué prueba hace? (Ej: 100ml)">
                    
                    <button type="button" id="btnAddLineup" class="action-btn btn-add-lineup">⬇ AÑADIR A LISTA</button>
                </div>

                <div class="lineup-box" id="listaVisual">
                    <p style="color: #666; text-align: center; font-size: 0.8rem;">Ningún atleta añadido aún</p>
                </div>

                <button type="submit" class="action-btn btn-create">GUARDAR COMPETICIÓN</button>
            </form>
        </div>

    </div>

    <script type="module" src="../js/admin.js"></script>

</body>
</html>
