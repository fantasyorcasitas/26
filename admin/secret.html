<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Fantasy Track</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-container">
        <h1 style="text-align: center; color: white; margin-bottom: 30px;">
            <i class="fa-solid fa-user-secret"></i> ZONA ADMIN
        </h1>

        <div class="admin-section">
            <h2><i class="fa-solid fa-person-running"></i> Gestión de Atletas</h2>
            
            <div class="edit-controls">
                <div style="flex-grow: 1; width: 100%;">
                    <label>Editar atleta existente:</label>
                    <select id="selectorEditarAtleta">
                        <option value="">-- Selecciona para editar --</option>
                    </select>
                </div>
                <button type="button" id="btnCargarAtleta" class="btn-action" style="width: auto; margin: 0; background: #333;">
                    <i class="fa-solid fa-pen-to-square"></i> Cargar Datos
                </button>
            </div>

            <form id="formAtleta">
                <input type="hidden" id="atletaIdHidden">
                <input type="hidden" id="fotoActualHidden"> 

                <div class="form-grid">
                    <div>
                        <label>Nombre</label>
                        <input type="text" id="atlNombre" required placeholder="Ej: Ana">
                    </div>
                    <div>
                        <label>Apellidos</label>
                        <input type="text" id="atlApellidos" required placeholder="Ej: Peleteiro">
                    </div>
                    <div>
                        <label>Categoría</label>
                        <select id="atlCategoria" required>
                            <option value="Velocidad">Velocidad</option>
                            <option value="Medio Fondo">Medio Fondo</option>
                            <option value="Fondo">Fondo</option>
                            <option value="Saltos">Saltos</option>
                            <option value="Lanzamientos">Lanzamientos</option>
                            <option value="Marcha">Marcha</option>
                            <option value="Combinadas">Combinadas</option>
                        </select>
                    </div>
                    <div>
                        <label>Precio (Valor en M)</label>
                        <input type="number" id="atlPrecio" required placeholder="Ej: 90">
                    </div>
                    <div class="full-width">
                        <label>Pruebas Principales (Máx 2, separadas por coma)</label>
                        <input type="text" id="atlPruebas" placeholder="Ej: 100m, 200m">
                    </div>
                    <div>
                        <label>Categoría</label>
                        <select id="atlCatMarcas">
                            <option value="Elite Mundial">u18</option>
                            <option value="Internacional">u20</option>
                            <option value="Nacional Top">u23</option>
                            <option value="Promesa">Senior</option>
                        </select>
                    </div>
                    
                    <div class="full-width">
                        <label>Foto (Selecciona de tu carpeta 'images')</label>
                        <input type="file" id="atlFotoInput" accept="image/*" style="padding: 5px;">
                        <p style="font-size: 0.75rem; color: #888; margin-top: 5px;">
                            <i class="fa-solid fa-circle-info"></i> El archivo debe estar guardado en la carpeta <strong>/images</strong> de tu proyecto.
                            <br>Ruta que se guardará: <span id="rutaPreview" style="color: var(--primary);">../images/???</span>
                        </p>
                    </div>
                </div>

                <button type="submit" id="btnSubmitAtleta" class="btn-action">CREAR ATLETA</button>
                <button type="button" id="btnCancelarEdicion" class="btn-action btn-secondary" style="display:none;">CANCELAR EDICIÓN</button>
            </form>
        </div>

        <div class="admin-section">
            <h2><i class="fa-solid fa-trophy"></i> Crear Competición</h2>
            
            <form id="formCompe">
                <div class="form-grid">
                    <div class="full-width">
                        <label>Nombre Competición</label>
                        <input type="text" id="compNombre" required placeholder="Ej: Diamond League Paris">
                    </div>
                    <div>
                        <label>Fecha</label>
                        <input type="date" id="compFecha" required>
                    </div>
                    <div>
                        <label>Lugar</label>
                        <input type="text" id="compLugar" required placeholder="Ej: Paris, Francia">
                    </div>
                    <div class="full-width">
                        <label>Pruebas Disponibles (Texto resumen)</label>
                        <input type="text" id="compPruebasTexto" placeholder="Ej: 100m, 400mV, Salto de Altura...">
                    </div>
                    <div class="full-width">
                        <label>Links (Resultados/Streaming)</label>
                        <input type="text" id="compLinks" placeholder="http://...">
                    </div>
                </div>

                <hr style="border-color: #333; margin: 20px 0;">
                
                <h3 style="color:white; font-size: 1rem; margin-bottom: 10px;">Añadir Participantes (Lineup)</h3>
                <div class="form-grid" style="align-items: end;">
                    <div class="full-width">
                        <label>Seleccionar Atleta de BD</label>
                        <select id="selectorAtletasLineup">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div>
                        <label>Prueba Específica</label>
                        <input type="text" id="inputPruebaEspecifica" placeholder="Ej: 100m">
                    </div>
                    <div>
                        <button type="button" id="btnAddLineup" class="btn-action" style="margin: 0; background: #444;">+ AÑADIR</button>
                    </div>
                </div>

                <div id="listaVisual" class="lineup-box">
                    <p style="color: #666; text-align: center;">Ningún atleta añadido aún</p>
                </div>

                <button type="submit" class="btn-action">GUARDAR COMPETICIÓN</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "../js/firebase-config.js";
        import { collection, addDoc, getDocs, orderBy, query, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // === 1. SEGURIDAD: PORTERO DE DISCOTECA ===
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);
                // Verificamos si es admin
                if (docSnap.exists() && docSnap.data().rol === "admin") {
                    console.log("Acceso Admin concedido.");
                    cargarSelectores();
                } else {
                    document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:50px;'>⛔ ACCESO DENEGADO</h1>";
                    setTimeout(() => window.location.href = "../docs/home.html", 1500);
                }
            } else {
                window.location.href = "../index.html";
            }
        });

        let listaParticipantes = []; 

        // === 2. UTILIDAD: VER RUTA DE LA FOTO ===
        document.getElementById('atlFotoInput').addEventListener('change', function() {
            if(this.files && this.files[0]) {
                // Generamos la ruta automáticamente
                document.getElementById('rutaPreview').innerText = "../images/" + this.files[0].name;
            }
        });

        // === 3. CARGAR LOS DESPLEGABLES ===
        async function cargarSelectores() {
            const selEdit = document.getElementById('selectorEditarAtleta');
            const selLineup = document.getElementById('selectorAtletasLineup');
            
            selEdit.innerHTML = '<option>Cargando...</option>';

            try {
                const q = query(collection(db, "atletas"), orderBy("nombre"));
                const querySnapshot = await getDocs(q);

                let htmlOptions = '<option value="">-- Selecciona un Atleta --</option>';

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Guardamos la info del atleta en el HTML para poder editarlo luego sin recargar
                    const safeData = JSON.stringify(data).replace(/"/g, '&quot;');
                    
                    htmlOptions += `<option value="${doc.id}" data-info="${safeData}">
                        ${data.nombre} ${data.apellidos}
                    </option>`;
                });

                selEdit.innerHTML = htmlOptions;
                selLineup.innerHTML = htmlOptions;
            } catch (error) {
                console.error(error);
            }
        }

        // === 4. BOTÓN "CARGAR DATOS" (EDITAR) ===
        document.getElementById('btnCargarAtleta').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarAtleta');
            const id = select.value;
            if(!id) return alert("Selecciona a alguien primero");

            const option = select.options[select.selectedIndex];
            const data = JSON.parse(option.getAttribute('data-info'));

            // Rellenar formulario
            document.getElementById('atletaIdHidden').value = id;
            document.getElementById('atlNombre').value = data.nombre;
            document.getElementById('atlApellidos').value = data.apellidos;
            document.getElementById('atlCategoria').value = data.categoria;
            document.getElementById('atlPrecio').value = data.precio;
            document.getElementById('atlPruebas').value = data.pruebas_principales || "";
            document.getElementById('atlCatMarcas').value = data.cat_marcas || "Internacional";
            
            // Gestionar la foto
            document.getElementById('fotoActualHidden').value = data.foto; // Guardamos la antigua
            document.getElementById('rutaPreview').innerText = data.foto || "Sin foto";

            // Cambiar botones a modo "Edición"
            const btnSubmit = document.getElementById('btnSubmitAtleta');
            btnSubmit.innerText = "ACTUALIZAR DATOS";
            btnSubmit.style.background = "#ffae00"; // Naranja
            btnSubmit.style.color = "black";
            document.getElementById('btnCancelarEdicion').style.display = 'block';
        });

        // Botón Cancelar Edición
        document.getElementById('btnCancelarEdicion').addEventListener('click', resetFormAtleta);

        function resetFormAtleta() {
            document.getElementById('formAtleta').reset();
            document.getElementById('atletaIdHidden').value = "";
            document.getElementById('fotoActualHidden').value = "";
            document.getElementById('rutaPreview').innerText = "../images/???";
            
            const btnSubmit = document.getElementById('btnSubmitAtleta');
            btnSubmit.innerText = "CREAR ATLETA";
            btnSubmit.style.background = "var(--primary)";
            btnSubmit.style.color = "white";
            document.getElementById('btnCancelarEdicion').style.display = 'none';
        }

        // === 5. GUARDAR ATLETA (SUBMIT) ===
        document.getElementById('formAtleta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitAtleta');
            btn.innerText = "Procesando...";
            btn.disabled = true;

            const idEdicion = document.getElementById('atletaIdHidden').value;
            const fileInput = document.getElementById('atlFotoInput');
            
            // Lógica de FOTO:
            let rutaFoto = "https://cdn-icons-png.flaticon.com/512/74/74472.png"; // Icono por defecto

            if (fileInput.files.length > 0) {
                // 1. Si el usuario ha seleccionado un archivo nuevo, usamos ese nombre
                rutaFoto = "../images/" + fileInput.files[0].name;
            } else if (idEdicion) {
                // 2. Si estamos editando y NO ha seleccionado nada, mantenemos la foto vieja
                rutaFoto = document.getElementById('fotoActualHidden').value;
            }

            const datosAtleta = {
                nombre: document.getElementById('atlNombre').value,
                apellidos: document.getElementById('atlApellidos').value,
                categoria: document.getElementById('atlCategoria').value,
                precio: Number(document.getElementById('atlPrecio').value),
                pruebas_principales: document.getElementById('atlPruebas').value,
                cat_marcas: document.getElementById('atlCatMarcas').value,
                foto: rutaFoto
            };

            try {
                if (idEdicion) {
                    // Actualizar
                    await updateDoc(doc(db, "atletas", idEdicion), datosAtleta);
                    alert("✅ Atleta actualizado correctamente");
                } else {
                    // Crear nuevo
                    datosAtleta.puntos = 0;
                    datosAtleta.tendencia = "neutral";
                    await addDoc(collection(db, "atletas"), datosAtleta);
                    alert("✅ Nuevo atleta creado");
                }
                resetFormAtleta();
                cargarSelectores();
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerText = idEdicion ? "ACTUALIZAR DATOS" : "CREAR ATLETA";
                btn.disabled = false;
            }
        });

        // === 6. GESTIÓN DE COMPETICIONES ===
        document.getElementById('btnAddLineup').addEventListener('click', () => {
            const selector = document.getElementById('selectorAtletasLineup');
            const inputPrueba = document.getElementById('inputPruebaEspecifica');
            const idAtleta = selector.value;
            
            if (!idAtleta || !inputPrueba.value) return alert("⚠️ Faltan datos");
            
            const nombreAtleta = selector.options[selector.selectedIndex].text.trim();
            
            listaParticipantes.push({
                id_atleta: idAtleta,
                nombre_completo: nombreAtleta,
                prueba: inputPrueba.value,
                resultado: null
            });

            actualizarVisual();
            inputPrueba.value = "";
        });

        function actualizarVisual() {
            const container = document.getElementById('listaVisual');
            container.innerHTML = listaParticipantes.length ? "" : '<p style="color: #666; text-align: center;">Ningún atleta añadido aún</p>';
            
            listaParticipantes.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lineup-item';
                div.innerHTML = `
                    <div><strong>${item.nombre_completo}</strong> <small>(${item.prueba})</small></div>
                    <i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="window.borrarDelLineup(${index})"></i>
                `;
                container.appendChild(div);
            });
        }

        window.borrarDelLineup = (index) => {
            listaParticipantes.splice(index, 1);
            actualizarVisual();
        };

        document.getElementById('formCompe').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (listaParticipantes.length === 0 && !confirm("⚠️ ¿Crear sin atletas?")) return;

            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "competiciones"), {
                    nombre: document.getElementById('compNombre').value,
                    fecha: document.getElementById('compFecha').value,
                    lugar: document.getElementById('compLugar').value,
                    pruebas_resumen: document.getElementById('compPruebasTexto').value,
                    links: document.getElementById('compLinks').value,
                    participantes: listaParticipantes,
                    estado: "pendiente"
                });
                alert("🏆 Competición creada!");
                e.target.reset();
                listaParticipantes = [];
                actualizarVisual();
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerText = "GUARDAR COMPETICIÓN";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
