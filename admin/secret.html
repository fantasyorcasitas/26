<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Fantasy Track</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* AJUSTES VISUALES ADMIN */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
        }

        .admin-container {
            padding-top: 130px !important;
            padding-bottom: 100px !important;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%; z-index: 1000;
            background: #000; border-bottom: 2px solid var(--primary);
        }

        /* Inputs específicos de Admin */
        select, input {
            background: #111 !important;
            color: white !important;
            border: 1px solid #555 !important;
        }

        /* Estilos para los resultados en la lista */
        .result-text {
            background: #000 !important;
            border: 1px solid #444 !important;
            color: #ccc !important;
            width: 120px;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }

        .result-points {
            background: #000 !important;
            border: 1px solid var(--primary) !important;
            color: var(--primary) !important;
            width: 70px;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }

        /* Botón de Borrar (Rojo) */
        .btn-delete {
            background: #d63031 !important;
            color: white !important;
            border: none !important;
            margin-left: 10px;
            display: none; /* Oculto por defecto */
        }
        .btn-delete:hover { background: #ff0000 !important; }

        /* Botón Cerrar Jornada (Dorado) */
        .btn-close-round {
            background: linear-gradient(45deg, #ff5e00, #ff9100) !important;
            color: white !important;
            font-weight: 800 !important;
            border: none !important;
            padding: 15px !important;
            margin-top: 20px !important;
            width: 100% !important;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo" style="color: #ff5e00; padding-left: 20px;">
            <i class="fa-solid fa-user-secret"></i> ZONA <span>ADMIN</span>
        </div>
        <div class="nav-links" style="padding-right: 20px;">
            <a href="../docs/home.html" style="background: rgba(255,255,255,0.1); border-radius: 20px; padding: 8px 15px; color: white; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Web
            </a>
        </div>
    </nav>

    <div class="admin-container">
        
        <div class="admin-section">
            <h2><i class="fa-solid fa-person-running"></i> Gestión de Atletas</h2>
            
            <div class="edit-controls">
                <div style="flex-grow: 1; width: 100%;">
                    <label>Editar atleta existente:</label>
                    <select id="selectorEditarAtleta">
                        <option value="">Cargando lista...</option>
                    </select>
                </div>
                <button type="button" id="btnCargarAtleta" class="btn-action" style="width: auto; margin: 0; background: #333;">
                    <i class="fa-solid fa-pen-to-square"></i> Cargar
                </button>
            </div>

            <form id="formAtleta">
                <input type="hidden" id="atletaIdHidden">
                <input type="hidden" id="fotoActualHidden"> 

                <div class="form-grid">
                    <div><label>Nombre</label><input type="text" id="atlNombre" required placeholder="Ej: Ana"></div>
                    <div><label>Apellidos</label><input type="text" id="atlApellidos" required placeholder="Ej: Peleteiro"></div>
                    <div><label>Categoría</label>
                        <select id="atlCategoria" required>
                            <option value="Velocidad corta">Velocidad corta</option>
                            <option value="Velocidad larga">Velocidad larga</option>
                            <option value="Saltos">Saltos</option>
                            <option value="Lanzamientos">Lanzamientos</option>
                            <option value="Marcha">Marcha</option>
                            <option value="Combinadas">Combinadas</option>
                        </select>
                    </div>
                    <div><label>Precio (M)</label><input type="number" id="atlPrecio" required placeholder="Ej: 90"></div>
                    <div class="full-width"><label>Pruebas</label><input type="text" id="atlPruebas" placeholder="Ej: 100m, 200m"></div>
                    <div><label>Categoría (Edad)</label>
                        <select id="atlCatMarcas">
                            <option value="u18">u18</option>
                            <option value="u20">u20</option>
                            <option value="u23">u23</option>
                            <option value="Senior">Senior</option>
                            <option value="Master">Master</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <label>Foto</label>
                        <div style="background: #222; padding: 10px; border: 1px dashed #555; border-radius: 5px;">
                            <input type="file" id="atlFotoInput" accept="image/*">
                            <p style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">
                                Ruta generada: <span id="rutaPreview" style="color: #ff5e00; font-family: monospace;">../images/???</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" id="btnSubmitAtleta" class="btn-action">CREAR ATLETA</button>
                    <button type="button" id="btnBorrarAtleta" class="btn-action btn-delete">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button type="button" id="btnCancelarEdicion" class="btn-action btn-secondary" style="display:none; background: #666;">CANCELAR</button>
                </div>
            </form>
        </div>

        <div class="admin-section">
            <h2><i class="fa-solid fa-trophy"></i> Gestión de Competiciones</h2>
            
            <div class="edit-controls" style="border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px;">
                <div style="flex-grow: 1; width: 100%;">
                    <label>Editar competición existente:</label>
                    <select id="selectorEditarCompe">
                        <option value="">Cargando lista...</option>
                    </select>
                </div>
                <button type="button" id="btnCargarCompe" class="btn-action" style="width: auto; margin: 0; background: #333;">
                    <i class="fa-solid fa-pen-to-square"></i> Cargar
                </button>
            </div>

            <form id="formCompe">
                <input type="hidden" id="compeIdHidden"> 
                <div class="form-grid">
                    <div class="full-width"><label>Nombre</label><input type="text" id="compNombre" required></div>
                    <div><label>Fecha</label><input type="date" id="compFecha" required></div>
                    <div><label>Lugar</label><input type="text" id="compLugar" required></div>
                    <div class="full-width"><label>Estado</label>
                        <select id="compEstado">
                            <option value="pendiente">Pendiente</option>
                            <option value="finalizada">Finalizada</option>
                        </select>
                    </div>
                    <div class="full-width"><label>Links</label><input type="text" id="compLinks"></div>
                </div>

                <hr style="border-color: #333; margin: 30px 0;">
                
                <h3 style="color:white; font-size: 1.1rem; margin-bottom: 15px;">Participantes y Resultados</h3>
                
                <div class="form-grid" style="align-items: end; background: #222; padding: 15px; border-radius: 8px;">
                    <div class="full-width">
                        <label>Añadir Atleta</label>
                        <select id="selectorAtletasLineup"><option value="">Cargando...</option></select>
                    </div>
                    <div><label>Prueba</label><input type="text" id="inputPruebaEspecifica" placeholder="Ej: 100m"></div>
                    <div><button type="button" id="btnAddLineup" class="btn-action" style="margin: 0; background: #444;">+ AÑADIR</button></div>
                </div>

                <div id="listaVisual" class="lineup-box">
                    <p style="color: #666; text-align: center;">Lista vacía.</p>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap;">
                    <button type="submit" id="btnSubmitCompe" class="btn-action" style="flex: 1;">CREAR / GUARDAR DATOS</button>
                    <button type="button" id="btnBorrarCompe" class="btn-action btn-delete" style="width: auto;">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button type="button" id="btnCancelarCompe" class="btn-action btn-secondary" style="display:none; background: #666; width:auto;">CANCELAR</button>
                </div>

                <button type="button" id="btnCerrarJornada" class="btn-action btn-close-round">
                    <i class="fa-solid fa-calculator"></i> CERRAR JORNADA Y REPARTIR PUNTOS
                </button>

            </form>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "../js/firebase-config.js";
        import { collection, addDoc, getDocs, orderBy, query, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // === 1. SEGURIDAD ===
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);
                const userData = docSnap.exists() ? docSnap.data() : null;
                if (userData && userData.rol === "admin") {
                    cargarSelectoresAtletas();
                    cargarSelectorCompes();
                } else {
                    document.body.innerHTML = "<h1>⛔ ACCESO DENEGADO</h1>";
                    setTimeout(() => window.location.href = "../docs/home.html", 1500);
                }
            } else {
                window.location.href = "../index.html";
            }
        });

        let listaParticipantes = []; 

        // CARGAS
        async function cargarSelectoresAtletas() {
            const selEdit = document.getElementById('selectorEditarAtleta');
            const selLineup = document.getElementById('selectorAtletasLineup');
            try {
                const q = query(collection(db, "atletas"), orderBy("nombre"));
                const querySnapshot = await getDocs(q);
                let html = '<option value="">-- Selecciona Atleta --</option>';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const safeData = JSON.stringify(data).replace(/"/g, '&quot;');
                    html += `<option value="${doc.id}" data-info="${safeData}">${data.nombre} ${data.apellidos}</option>`;
                });
                selEdit.innerHTML = html;
                selLineup.innerHTML = html;
            } catch (error) { console.error(error); }
        }

        async function cargarSelectorCompes() {
            const selCompe = document.getElementById('selectorEditarCompe');
            try {
                const q = query(collection(db, "competiciones"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                let html = '<option value="">-- Selecciona para Editar --</option>';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const safeData = JSON.stringify(data).replace(/"/g, '&quot;');
                    html += `<option value="${doc.id}" data-info="${safeData}">${data.fecha} - ${data.nombre}</option>`;
                });
                selCompe.innerHTML = html;
            } catch (error) { console.error(error); }
        }

        // ================= GESTIÓN ATLETAS =================
        document.getElementById('atlFotoInput').addEventListener('change', function() {
            if(this.files && this.files[0]) document.getElementById('rutaPreview').innerText = "../images/" + this.files[0].name;
        });

        document.getElementById('btnCargarAtleta').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarAtleta');
            if(!select.value) return alert("Selecciona atleta");
            const option = select.options[select.selectedIndex];
            const data = JSON.parse(option.getAttribute('data-info'));
            
            // Rellenar formulario
            document.getElementById('atletaIdHidden').value = select.value;
            document.getElementById('atlNombre').value = data.nombre;
            document.getElementById('atlApellidos').value = data.apellidos;
            document.getElementById('atlCategoria').value = data.categoria;
            document.getElementById('atlPrecio').value = data.precio;
            document.getElementById('atlPruebas').value = data.pruebas_principales || "";
            document.getElementById('atlCatMarcas').value = data.cat_marcas || "u23"; // Valor por defecto seguro
            document.getElementById('fotoActualHidden').value = data.foto;
            
            // Mostrar botones
            const btn = document.getElementById('btnSubmitAtleta');
            btn.innerText = "ACTUALIZAR ATLETA";
            btn.style.background = "#ffae00"; btn.style.color = "black";
            document.getElementById('btnCancelarEdicion').style.display = 'block';
            document.getElementById('btnBorrarAtleta').style.display = 'block';
        });

        // BORRAR ATLETA
        document.getElementById('btnBorrarAtleta').addEventListener('click', async () => {
            const id = document.getElementById('atletaIdHidden').value;
            if(!id) return;
            if(confirm("⚠️ ¿ELIMINAR ATLETA?")) {
                await deleteDoc(doc(db, "atletas", id));
                alert("Atleta eliminado.");
                window.location.reload();
            }
        });

        document.getElementById('btnCancelarEdicion').addEventListener('click', () => { window.location.reload(); });

        document.getElementById('formAtleta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('atletaIdHidden').value;
            const fileInput = document.getElementById('atlFotoInput');
            let rutaFoto = id ? document.getElementById('fotoActualHidden').value : "";
            if (fileInput.files.length > 0) rutaFoto = "../images/" + fileInput.files[0].name;

            const datos = {
                nombre: document.getElementById('atlNombre').value,
                apellidos: document.getElementById('atlApellidos').value,
                categoria: document.getElementById('atlCategoria').value,
                precio: Number(document.getElementById('atlPrecio').value),
                pruebas_principales: document.getElementById('atlPruebas').value,
                cat_marcas: document.getElementById('atlCatMarcas').value,
                foto: rutaFoto
            };

            if(id) await updateDoc(doc(db, "atletas", id), datos);
            else { datos.puntos = 0; await addDoc(collection(db, "atletas"), datos); }
            alert("Guardado!");
            window.location.reload();
        });

        // ================= GESTIÓN COMPETICIONES =================
        document.getElementById('btnCargarCompe').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarCompe');
            if(!select.value) return alert("Selecciona competición");
            const data = JSON.parse(select.options[select.selectedIndex].getAttribute('data-info'));

            document.getElementById('compeIdHidden').value = select.value;
            document.getElementById('compNombre').value = data.nombre;
            document.getElementById('compFecha').value = data.fecha;
            document.getElementById('compLugar').value = data.lugar;
            document.getElementById('compEstado').value = data.estado || "pendiente";
            document.getElementById('compLinks').value = data.links || "";

            listaParticipantes = data.participantes || [];
            actualizarVisualCompe();

            const btn = document.getElementById('btnSubmitCompe');
            btn.innerText = "ACTUALIZAR DATOS";
            btn.style.background = "#ffae00"; btn.style.color = "black";
            document.getElementById('btnCancelarCompe').style.display = 'block';
            document.getElementById('btnBorrarCompe').style.display = 'block';
        });

        // BORRAR COMPETICIÓN
        document.getElementById('btnBorrarCompe').addEventListener('click', async () => {
            const id = document.getElementById('compeIdHidden').value;
            if(!id) return;
            if(confirm("⚠️ ¿ELIMINAR COMPETICIÓN?")) {
                await deleteDoc(doc(db, "competiciones", id));
                alert("Competición eliminada.");
                window.location.reload();
            }
        });

        document.getElementById('btnAddLineup').addEventListener('click', () => {
            const selector = document.getElementById('selectorAtletasLineup');
            const prueba = document.getElementById('inputPruebaEspecifica').value;
            if (!selector.value || !prueba) return alert("Faltan datos");

            listaParticipantes.push({
                id_atleta: selector.value,
                nombre_completo: selector.options[selector.selectedIndex].text.trim(),
                prueba: prueba,
                resultado: "", // Texto
                puntos: 0 // Numérico
            });
            actualizarVisualCompe();
        });

        function actualizarVisualCompe() {
            const container = document.getElementById('listaVisual');
            container.innerHTML = listaParticipantes.length ? "" : '<p style="color:#666;text-align:center;">Lista vacía.</p>';
            
            listaParticipantes.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lineup-item';
                div.style.cssText = "display:flex; align-items:center; gap:10px; border-bottom:1px solid #333; padding:5px; margin-bottom:5px;";
                
                div.innerHTML = `
                    <div style="flex-grow:1;">
                        <strong>${item.nombre_completo}</strong> <span style="font-size:0.8rem;color:#888;">(${item.prueba})</span>
                    </div>
                    <input type="text" class="result-text" placeholder="Texto (1º)" value="${item.resultado || ''}" onchange="updItem(${index}, 'resultado', this.value)">
                    <input type="number" class="result-points" placeholder="Pts" value="${item.puntos || 0}" onchange="updItem(${index}, 'puntos', this.value)">
                    <i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="delLineup(${index})"></i>
                `;
                container.appendChild(div);
            });
        }

        window.updItem = (i, field, val) => {
            if (field === 'puntos') val = Number(val); // AQUÍ ESTÁ LA MAGIA: FORZAR NÚMERO
            listaParticipantes[i][field] = val;
        };

        window.delLineup = (i) => {
            listaParticipantes.splice(i, 1);
            actualizarVisualCompe();
        };

        // 4. GUARDAR / ACTUALIZAR COMPETICIÓN
        document.getElementById('formCompe').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitCompe');
            btn.disabled = true;
            const id = document.getElementById('compeIdHidden').value;

            const datos = {
                nombre: document.getElementById('compNombre').value,
                fecha: document.getElementById('compFecha').value,
                lugar: document.getElementById('compLugar').value,
                estado: document.getElementById('compEstado').value,
                links: document.getElementById('compLinks').value,
                participantes: listaParticipantes
            };

            try {
                if(id) { await updateDoc(doc(db, "competiciones", id), datos); alert("Actualizada"); }
                else { await addDoc(collection(db, "competiciones"), datos); alert("Creada"); }
                window.location.reload();
            } catch (error) { alert("Error: " + error.message); }
            btn.disabled = false;
        });

        // =======================================================
        // 5. CERRAR JORNADA (LÓGICA ARREGLADA)
        // =======================================================
        document.getElementById('btnCerrarJornada').addEventListener('click', async () => {
            if(!confirm("⚠️ ¿Cerrar jornada? (Solo puntúan equipos de 3 + Capi x1.5)")) return;

            const btn = document.getElementById('btnCerrarJornada');
            btn.innerText = "CALCULANDO...";
            btn.disabled = true;

            try {
                // A) Guardar estado
                const idCompe = document.getElementById('compeIdHidden').value;
                if(!idCompe) return alert("Guarda la competición primero");

                const datosCompe = {
                    nombre: document.getElementById('compNombre').value,
                    fecha: document.getElementById('compFecha').value,
                    lugar: document.getElementById('compLugar').value,
                    estado: "finalizada",
                    links: document.getElementById('compLinks').value,
                    participantes: listaParticipantes
                };
                await updateDoc(doc(db, "competiciones", idCompe), datosCompe);

                // B) Mapa de puntos (Forzando números)
                const mapaPuntos = {};
                listaParticipantes.forEach(p => {
                    if(Number(p.puntos) > 0) mapaPuntos[p.id_atleta] = Number(p.puntos);
                });

                // C) ACTUALIZAR MANAGERS
                const usersSnap = await getDocs(collection(db, "usuarios"));
                const batchPromises = [];
                
                usersSnap.forEach(userDoc => {
                    const userData = userDoc.data();
                    const equipo = userData.equipo || []; // Array IDs
                    const capitan = userData.capitanId;
                    
                    // --- NUEVA REGLA: SI NO TIENE 3 JUGADORES, NO PUNTÚA ---
                    if (equipo.length !== 3) {
                        console.log(`Usuario ${userData.nick || userDoc.id} tiene ${equipo.length} jugadores. NO PUNTÚA.`);
                        return; 
                    }

                    let puntosJornadaManager = 0;

                    equipo.forEach(atletaId => {
                        if (mapaPuntos[atletaId]) {
                            let pts = mapaPuntos[atletaId];
                            
                            // Capi x1.5
                            if (atletaId === capitan) {
                                pts = pts * 1.5; 
                            }
                            
                            puntosJornadaManager += pts;
                        }
                    });

                    // Actualizar usuario
                    const nuevosPuntosTotal = (userData.puntos_total || 0) + puntosJornadaManager;
                    const promise = updateDoc(doc(db, "usuarios", userDoc.id), {
                        puntos_total: nuevosPuntosTotal,
                        puntos_ultima_jornada: puntosJornadaManager
                    });
                    batchPromises.push(promise);
                });

                // D) ACTUALIZAR ATLETAS
                for (const item of listaParticipantes) {
                    if (Number(item.puntos) > 0) {
                        const atlRef = doc(db, "atletas", item.id_atleta);
                        const atlSnap = await getDoc(atlRef);
                        if (atlSnap.exists()) {
                            const atlData = atlSnap.data();
                            const ptsRound = Number(item.puntos);
                            const nuevoTotal = (atlData.puntos || 0) + ptsRound;
                            
                            // Subida de precio simple
                            let nuevoPrecio = atlData.precio;
                            if (ptsRound >= 30) nuevoPrecio += 1;
                            if (ptsRound <= 5 && nuevoPrecio > 1) nuevoPrecio -= 1;

                            batchPromises.push(updateDoc(atlRef, {
                                puntos: nuevoTotal,
                                puntos_ultima_jornada: ptsRound,
                                precio: nuevoPrecio
                            }));
                        }
                    }
                }

                await Promise.all(batchPromises);

                alert("🏆 ¡JORNADA CERRADA! Puntos repartidos.");
                window.location.reload();

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "CERRAR JORNADA";
            }
        });
    </script>
</body>
</html>
