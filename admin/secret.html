<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Fantasy Track</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* AJUSTES VISUALES ADMIN */
        html, body { overflow-y: auto !important; height: auto !important; min-height: 100vh; }
        .admin-container { padding-top: 130px !important; padding-bottom: 100px !important; max-width: 1000px; margin: 0 auto; position: relative; z-index: 10; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: #000; border-bottom: 2px solid var(--primary); }
        select, input { background: #111 !important; color: white !important; border: 1px solid #555 !important; }
        
        /* Inputs específicos de resultados */
        .result-text { background: #000 !important; width: 120px; padding: 5px; border-radius: 4px; border: 1px solid #444 !important; color: #ccc !important; }
        .result-points { background: #000 !important; width: 70px; padding: 5px; border-radius: 4px; border: 1px solid var(--primary) !important; color: var(--primary) !important; font-weight: bold; text-align: center; }

        /* Botón borrar */
        .btn-delete { background: #d63031 !important; color: white !important; border: none !important; margin-left: 10px; display: none; }
        .btn-delete:hover { background: #ff0000 !important; }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo" style="color: #ff5e00; padding-left: 20px;">
            <i class="fa-solid fa-user-secret"></i> ZONA <span>ADMIN</span>
        </div>
        <div class="nav-links" style="padding-right: 20px;">
            <a href="../docs/home.html" style="background: rgba(255,255,255,0.1); border-radius: 20px; padding: 8px 15px; color: white; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </div>
    </nav>

    <div class="admin-container">
        
        <div class="admin-section" style="opacity: 0.9;">
            <h2 style="font-size: 1rem;"><i class="fa-solid fa-person-running"></i> Gestión de Atletas</h2>
            <div class="edit-controls">
                <select id="selectorEditarAtleta" style="width: 100%;"><option>Cargando...</option></select>
                <button id="btnCargarAtleta" class="btn-action" style="width: auto; margin:0; padding: 5px 15px;">Cargar</button>
            </div>
            
            <details id="detailsAtleta">
                <summary style="color:white; cursor:pointer; padding:10px;">Desplegar formulario de atleta</summary>
                <form id="formAtleta" style="margin-top:10px;">
                    <input type="hidden" id="atletaIdHidden"><input type="hidden" id="fotoActualHidden">
                    <div class="form-grid">
                        <input type="text" id="atlNombre" required placeholder="Nombre">
                        <input type="text" id="atlApellidos" required placeholder="Apellidos">
                        <select id="atlCategoria"><option value="Velocidad">Velocidad</option><option value="Medio Fondo">Medio Fondo</option><option value="Fondo">Fondo</option><option value="Saltos">Saltos</option><option value="Lanzamientos">Lanzamientos</option><option value="Marcha">Marcha</option><option value="Combinadas">Combinadas</option></select>
                        <input type="number" id="atlPrecio" required placeholder="Precio (M)">
                        <input type="file" id="atlFotoInput">
                    </div>
                    <div style="display: flex; margin-top:10px;">
                        <button type="submit" id="btnSubmitAtleta" class="btn-action">GUARDAR / ACTUALIZAR</button>
                        <button type="button" id="btnBorrarAtleta" class="btn-action btn-delete"><i class="fa-solid fa-trash"></i> ELIMINAR</button>
                    </div>
                </form>
            </details>
        </div>

        <div class="admin-section">
            <h2 style="color: var(--primary);"><i class="fa-solid fa-calculator"></i> Centro de Resultados</h2>
            
            <div class="edit-controls" style="border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px;">
                <div style="flex-grow: 1;">
                    <label>Competición a gestionar:</label>
                    <select id="selectorEditarCompe">
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <button type="button" id="btnCargarCompe" class="btn-action" style="width: auto; margin: 0; background: #333;">
                    <i class="fa-solid fa-pen-to-square"></i> Cargar
                </button>
            </div>

            <form id="formCompe">
                <input type="hidden" id="compeIdHidden">

                <div class="form-grid">
                    <div class="full-width"><label>Nombre</label><input type="text" id="compNombre" required></div>
                    <div><label>Fecha</label><input type="date" id="compFecha" required></div>
                    <div><label>Lugar</label><input type="text" id="compLugar" required></div>
                    <div><label>Estado</label>
                        <select id="compEstado">
                            <option value="pendiente">Pendiente</option>
                            <option value="finalizada">Finalizada</option>
                        </select>
                    </div>
                    <div class="full-width"><label>Links</label><input type="text" id="compLinks"></div>
                </div>

                <hr style="border-color: #333; margin: 20px 0;">
                
                <div style="background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444;">
                    <h3 style="color:white; font-size: 1rem; margin-bottom: 10px;">Reparto de Puntos</h3>
                    
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <select id="selectorAtletasLineup" style="flex-grow:1;"><option>Cargando...</option></select>
                        <input type="text" id="inputPruebaEspecifica" placeholder="Prueba (ej: 100m)" style="width:100px;">
                        <button type="button" id="btnAddLineup" class="btn-action" style="width:auto; margin:0;">+</button>
                    </div>

                    <div style="display:flex; justify-content:space-between; padding:0 10px; color:#888; font-size:0.8rem; margin-bottom:5px;">
                        <span>Atleta / Prueba</span>
                        <div style="display:flex; gap:20px; margin-right:30px;">
                            <span>Texto (Ej: 1º)</span>
                            <span>Puntos</span>
                        </div>
                    </div>

                    <div id="listaVisual" class="lineup-box" style="max-height: 400px; overflow-y: auto;">
                        <p style="color: #666; text-align: center;">Carga una competición...</p>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px; flex-direction: column;">
                    
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="btnSubmitCompe" class="btn-action" style="background: #333; border: 1px solid #555; flex-grow: 1;">
                            <i class="fa-solid fa-floppy-disk"></i> GUARDAR DATOS
                        </button>
                        <button type="button" id="btnBorrarCompe" class="btn-action btn-delete" style="width: auto;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    
                    <button type="button" id="btnCerrarJornada" class="btn-action" style="background: linear-gradient(45deg, #ff5e00, #ff9100); color: white; font-weight: 800; border: none; padding: 15px;">
                        <i class="fa-solid fa-trophy"></i> CERRAR JORNADA Y REPARTIR PUNTOS
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "../js/firebase-config.js";
        import { collection, addDoc, getDocs, orderBy, query, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // === SEGURIDAD ===
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);
                const userData = docSnap.exists() ? docSnap.data() : null;
                if (userData && userData.rol === "admin") {
                    cargarSelectoresAtletas();
                    cargarSelectorCompes();
                } else {
                    document.body.innerHTML = "<h1>⛔ Acceso Denegado</h1>";
                }
            } else {
                window.location.href = "../index.html";
            }
        });

        // VARIABLES
        let listaParticipantes = []; 

        // CARGAS
        async function cargarSelectoresAtletas() {
            const q = query(collection(db, "atletas"), orderBy("nombre"));
            const snap = await getDocs(q);
            let html = '<option value="">-- Atleta --</option>';
            snap.forEach(d => {
                const data = d.data();
                const safe = JSON.stringify(data).replace(/"/g, '&quot;');
                html += `<option value="${d.id}" data-info="${safe}">${data.nombre} ${data.apellidos}</option>`;
            });
            document.getElementById('selectorEditarAtleta').innerHTML = html;
            document.getElementById('selectorAtletasLineup').innerHTML = html;
        }

        async function cargarSelectorCompes() {
            const q = query(collection(db, "competiciones"), orderBy("fecha", "desc"));
            const snap = await getDocs(q);
            let html = '<option value="">-- Seleccionar Competición --</option>';
            snap.forEach(d => {
                const data = d.data();
                const safe = JSON.stringify(data).replace(/"/g, '&quot;');
                html += `<option value="${d.id}" data-info="${safe}">${data.fecha} - ${data.nombre}</option>`;
            });
            document.getElementById('selectorEditarCompe').innerHTML = html;
        }

        // ==========================================
        // GESTIÓN ATLETAS (Con Borrado)
        // ==========================================
        document.getElementById('atlFotoInput').addEventListener('change', function() { /* Lógica foto */ });

        document.getElementById('btnCargarAtleta').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarAtleta');
            if(!select.value) return;
            const data = JSON.parse(select.options[select.selectedIndex].getAttribute('data-info'));
            
            document.getElementById('atletaIdHidden').value = select.value;
            document.getElementById('atlNombre').value = data.nombre;
            document.getElementById('atlApellidos').value = data.apellidos;
            document.getElementById('atlCategoria').value = data.categoria;
            document.getElementById('atlPrecio').value = data.precio;
            document.getElementById('fotoActualHidden').value = data.foto;
            
            document.getElementById('detailsAtleta').open = true;
            document.getElementById('btnBorrarAtleta').style.display = 'inline-block'; // MOSTRAR BOTÓN BORRAR
        });

        // BOTÓN BORRAR ATLETA
        document.getElementById('btnBorrarAtleta').addEventListener('click', async () => {
            const id = document.getElementById('atletaIdHidden').value;
            if(!id) return;
            if(confirm("⚠️ ¿Estás seguro de ELIMINAR a este atleta? Desaparecerá de todos los equipos.")) {
                try {
                    await deleteDoc(doc(db, "atletas", id));
                    alert("Atleta eliminado.");
                    document.getElementById('formAtleta').reset();
                    document.getElementById('btnBorrarAtleta').style.display = 'none';
                    cargarSelectoresAtletas();
                } catch(e) { alert("Error: " + e.message); }
            }
        });

        // GUARDAR/EDITAR ATLETA
        document.getElementById('formAtleta').addEventListener('submit', async(e) => {
            e.preventDefault();
            const id = document.getElementById('atletaIdHidden').value;
            const fileInput = document.getElementById('atlFotoInput');
            let rutaFoto = id ? document.getElementById('fotoActualHidden').value : "https://cdn-icons-png.flaticon.com/512/74/74472.png";
            if (fileInput.files.length > 0) rutaFoto = "../images/" + fileInput.files[0].name;

            const datos = {
                nombre: document.getElementById('atlNombre').value,
                apellidos: document.getElementById('atlApellidos').value,
                categoria: document.getElementById('atlCategoria').value,
                precio: Number(document.getElementById('atlPrecio').value),
                foto: rutaFoto
            };

            try {
                if(id) await updateDoc(doc(db, "atletas", id), datos);
                else { datos.puntos = 0; await addDoc(collection(db, "atletas"), datos); }
                alert("Guardado!");
                document.getElementById('formAtleta').reset();
                document.getElementById('btnBorrarAtleta').style.display = 'none';
                cargarSelectoresAtletas();
            } catch(e) { alert(e.message); }
        });


        // ==========================================
        // GESTIÓN COMPETICIONES (Con Borrado y Capi 1.5)
        // ==========================================

        document.getElementById('btnCargarCompe').addEventListener('click', () => {
            const select = document.getElementById('selectorEditarCompe');
            if(!select.value) return;
            const data = JSON.parse(select.options[select.selectedIndex].getAttribute('data-info'));
            
            document.getElementById('compeIdHidden').value = select.value;
            document.getElementById('compNombre').value = data.nombre;
            document.getElementById('compFecha').value = data.fecha;
            document.getElementById('compLugar').value = data.lugar;
            document.getElementById('compEstado').value = data.estado || "pendiente";
            document.getElementById('compLinks').value = data.links || "";
            
            listaParticipantes = data.participantes || [];
            actualizarVisualCompe();

            document.getElementById('btnBorrarCompe').style.display = 'inline-block'; // MOSTRAR BOTÓN BORRAR
        });

        // BOTÓN BORRAR COMPETICIÓN
        document.getElementById('btnBorrarCompe').addEventListener('click', async () => {
            const id = document.getElementById('compeIdHidden').value;
            if(!id) return;
            if(confirm("⚠️ ¿Eliminar esta competición y todos sus datos?")) {
                try {
                    await deleteDoc(doc(db, "competiciones", id));
                    alert("Competición eliminada.");
                    document.getElementById('formCompe').reset();
                    listaParticipantes = [];
                    actualizarVisualCompe();
                    document.getElementById('btnBorrarCompe').style.display = 'none';
                    cargarSelectorCompes();
                } catch(e) { alert("Error: " + e.message); }
            }
        });

        // AÑADIR ATLETA AL LINEUP
        document.getElementById('btnAddLineup').addEventListener('click', () => {
            const sel = document.getElementById('selectorAtletasLineup');
            const prueba = document.getElementById('inputPruebaEspecifica').value;
            if(!sel.value) return;
            
            listaParticipantes.push({
                id_atleta: sel.value,
                nombre_completo: sel.options[sel.selectedIndex].text,
                prueba: prueba,
                resultado_texto: "",
                puntos: 0
            });
            actualizarVisualCompe();
        });

        // VISUALIZAR
        function actualizarVisualCompe() {
            const box = document.getElementById('listaVisual');
            box.innerHTML = "";
            listaParticipantes.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'lineup-item';
                div.style.cssText = "display:flex; align-items:center; gap:10px; margin-bottom:5px; padding-bottom:5px; border-bottom:1px solid #333;";
                
                div.innerHTML = `
                    <div style="flex-grow:1;">
                        <div style="color:white; font-size:0.9rem;">${item.nombre_completo}</div>
                        <div style="color:#666; font-size:0.8rem;">${item.prueba}</div>
                    </div>
                    <input type="text" class="result-text" placeholder="Ej: 1º" value="${item.resultado_texto || ''}" onchange="updItem(${i}, 'resultado_texto', this.value)">
                    <input type="number" class="result-points" placeholder="Pts" value="${item.puntos || 0}" onchange="updItem(${i}, 'puntos', this.value)">
                    <i class="fa-solid fa-trash" style="color:#e84118; cursor:pointer; margin-left:10px;" onclick="delItem(${i})"></i>
                `;
                box.appendChild(div);
            });
        }

        window.updItem = (i, field, val) => { if(field === 'puntos') val = Number(val); listaParticipantes[i][field] = val; };
        window.delItem = (i) => { listaParticipantes.splice(i, 1); actualizarVisualCompe(); };

        // GUARDAR DATOS (SIN CERRAR)
        document.getElementById('formCompe').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('compeIdHidden').value;
            const datos = {
                nombre: document.getElementById('compNombre').value,
                fecha: document.getElementById('compFecha').value,
                lugar: document.getElementById('compLugar').value,
                estado: document.getElementById('compEstado').value,
                links: document.getElementById('compLinks').value,
                participantes: listaParticipantes
            };

            if(id) await updateDoc(doc(db, "competiciones", id), datos);
            else await addDoc(collection(db, "competiciones"), datos);
            
            alert("✅ Datos guardados.");
            document.getElementById('formCompe').reset();
            listaParticipantes = [];
            actualizarVisualCompe();
            cargarSelectorCompes();
        });

        // =======================================================
        // 5. CERRAR JORNADA (LÓGICA ACTUALIZADA CAPI 1.5)
        // =======================================================
        document.getElementById('btnCerrarJornada').addEventListener('click', async () => {
            if(!confirm("⚠️ ¿Cerrar jornada y repartir puntos? (Capi x1.5)")) return;

            const btn = document.getElementById('btnCerrarJornada');
            btn.innerText = "CALCULANDO...";
            btn.disabled = true;

            try {
                // A) Guardar estado finalizada
                const idCompe = document.getElementById('compeIdHidden').value;
                if(!idCompe) return alert("Guarda la competición primero");

                const datosCompe = {
                    nombre: document.getElementById('compNombre').value,
                    fecha: document.getElementById('compFecha').value,
                    lugar: document.getElementById('compLugar').value,
                    estado: "finalizada",
                    links: document.getElementById('compLinks').value,
                    participantes: listaParticipantes
                };
                await updateDoc(doc(db, "competiciones", idCompe), datosCompe);

                // B) Mapa de puntos
                const mapaPuntos = {};
                listaParticipantes.forEach(p => {
                    if(p.puntos > 0) mapaPuntos[p.id_atleta] = p.puntos;
                });

                // C) ACTUALIZAR MANAGERS
                const usersSnap = await getDocs(collection(db, "usuarios"));
                const batchPromises = [];
                
                usersSnap.forEach(userDoc => {
                    const userData = userDoc.data();
                    const equipo = userData.equipo || [];
                    const capitan = userData.capitanId;
                    
                    let puntosJornadaManager = 0;

                    equipo.forEach(atletaId => {
                        if (mapaPuntos[atletaId]) {
                            let pts = mapaPuntos[atletaId];
                            
                            // *** CAMBIO CLAVE: MULTIPLICADOR x1.5 ***
                            if (atletaId === capitan) {
                                pts = pts * 1.5; 
                            }
                            
                            puntosJornadaManager += pts;
                        }
                    });

                    if (puntosJornadaManager > 0) {
                        const nuevosPuntosTotal = (userData.puntos_total || 0) + puntosJornadaManager;
                        
                        const promise = updateDoc(doc(db, "usuarios", userDoc.id), {
                            puntos_total: nuevosPuntosTotal,
                            puntos_ultima_jornada: puntosJornadaManager
                        });
                        batchPromises.push(promise);
                    }
                });

                // D) ACTUALIZAR ATLETAS
                for (const item of listaParticipantes) {
                    if (item.puntos > 0) {
                        const atlRef = doc(db, "atletas", item.id_atleta);
                        const atlSnap = await getDoc(atlRef);
                        if (atlSnap.exists()) {
                            const atlData = atlSnap.data();
                            const nuevoTotal = (atlData.puntos || 0) + item.puntos;
                            
                            // Subida de precio simple
                            let nuevoPrecio = atlData.precio;
                            if (item.puntos >= 30) nuevoPrecio += 1;
                            if (item.puntos <= 5 && nuevoPrecio > 1) nuevoPrecio -= 1;

                            batchPromises.push(updateDoc(atlRef, {
                                puntos: nuevoTotal,
                                puntos_ultima_jornada: item.puntos,
                                precio: nuevoPrecio
                            }));
                        }
                    }
                }

                await Promise.all(batchPromises);

                alert("🏆 ¡JORNADA CERRADA! (Capi sumó x1.5)");
                window.location.reload();

            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "CERRAR JORNADA";
            }
        });
    </script>
</body>
</html>
