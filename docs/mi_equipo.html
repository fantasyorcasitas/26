<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Mi Equipo | Fantasy Orcasitas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* RESET NUCLEAR */
        * { box-sizing: border-box; }
        html { background-color: #000000 !important; }
        body {
            display: block !important;
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
            background-color: transparent !important;
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* FONDO */
        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1532444458054-01a7dd3e9fca?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
            z-index: -2; opacity: 0.4;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.7)); z-index: -1;
        }

        /* NAVBAR */
        .navbar {
            position: sticky; /* Se pega arriba al hacer scroll */
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000;
            border-bottom: 2px solid #222;
            padding: 15px 20px;
            z-index: 1000;
            height: 70px;
            width: 100%;
        }

        .nav-logo a {
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo span { color: #ff5e00; } /* Naranja */

        /* MENÚ DE ESCRITORIO */
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #aaa;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
        color: #ff5e00 !important; /* Naranja */
        }

        .btn-logout {
            background: none;
            border: none;
            color: #ff5e00;
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: 10px;
        }

        .menu-toggle {
            display: none; /* Oculto en PC */
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* PRESUPUESTO */
        .budget-header {
            position: sticky; top: 70px; background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #333;
            width: 100%; padding: 10px 20px; display: flex; justify-content: center; z-index: 4000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .budget-content { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; }
        .budget-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .budget-number { font-size: 1.5rem; font-weight: 700; color: white; }
        .budget-number.positive { color: #4cd137; }
        .budget-number.negative { color: #e84118; }
        
        .debt-pill {
            background: rgba(232, 65, 24, 0.2); color: #e84118; padding: 4px 10px; border-radius: 20px;
            font-size: 0.7rem; font-weight: bold; display: none; border: 1px solid rgba(232, 65, 24, 0.5);
        }

        /* CAMPO */
        .dashboard-container {
            padding-top: 20px !important; padding-bottom: 120px !important;
            display: flex; flex-direction: column; align-items: center; width: 100%;
            padding-left: 15px; padding-right: 15px; position: relative; z-index: 1;
        }
        .pitch-area { width: 100%; max-width: 500px; margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .pitch-bg {
            width: 100%; background: linear-gradient(180deg, #151515 0%, #0f0f0f 100%);
            border: 1px solid #333; border-radius: 15px; padding: 30px 10px; position: relative;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .formation-wrapper { display: flex; flex-direction: column; align-items: center; gap: 25px; width: 100%; }
        .formation-row { display: flex; justify-content: center; gap: 20px; width: 100%; }

        /* CARTA JUGADOR */
        .player-card-slot {
            width: 90px; height: 135px; background: rgba(255,255,255,0.03); border: 2px dashed #444; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .player-card-slot.filled { border: 2px solid #ff5e00; background: #1a1a1a; cursor: default; }
        
        .slot-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; margin-bottom: 5px; }
        .slot-name { font-size: 0.75rem; color: white; font-weight: bold; text-align: center; max-width: 80px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .slot-price { font-size: 0.65rem; color: #4cd137; font-weight: 600; margin-bottom: 5px; }

        /* BOTONES CARTA */
        .card-actions { display: flex; gap: 5px; margin-top: 5px; z-index: 10; }
        .btn-mini { border: none; border-radius: 4px; padding: 2px 6px; font-size: 0.65rem; cursor: pointer; font-weight: bold; }
        .btn-remove { background: rgba(255, 59, 48, 0.2); color: #ff453a; border: 1px solid #ff453a; }
        .btn-captain { background: transparent; color: #888; border: 1px solid #666; }
        .btn-captain.active { background: #ffd700; color: black; border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }

        /* BOTÓN GUARDAR */
        .fab-save-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 4500; width: 90%; max-width: 400px; }
        .btn-save-fab {
            width: 100%; background: #ff5e00; color: white; border: none; padding: 15px; border-radius: 50px;
            font-size: 1rem; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 30px rgba(255, 94, 0, 0.4); cursor: pointer;
        }
        .btn-save-fab:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

        /* BOTÓN COMPARTIR EQUIPO */
        .btn-share-fab {
            width: 100%; background: linear-gradient(135deg, #00d4ff, #0099cc); color: white; border: none; padding: 12px; border-radius: 50px;
            font-size: 0.9rem; font-weight: 700; margin-top: 10px; box-shadow: 0 5px 20px rgba(0, 180, 220, 0.3); cursor: pointer; transition: 0.3s;
        }
        .btn-share-fab:hover { transform: scale(1.02); }
        .btn-share-fab:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 8000;
            display: none; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: #111; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 500px; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .modal-header { padding: 15px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .modal-body { padding: 0; overflow-y: auto; }
        
        .player-list-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222; cursor: pointer; }
        .player-list-item:hover { background: #222; }
        .player-list-item img { width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; border: 2px solid #333; object-fit: cover; }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 768px) {
            .navbar { padding: 10px 15px !important; }
            .menu-toggle { display: block !important; }
            .nav-links {
                position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: rgba(0,0,0,0.98);
                flex-direction: column; justify-content: center; align-items: center; z-index: 6000;
                transform: translateX(100%); transition: transform 0.3s ease-in-out;
            }
            .nav-links.active { transform: translateX(0); }
            .nav-links a { font-size: 1.5rem; margin: 20px 0; color: white !important; display: block; }
            .btn-logout { margin-top: 30px; font-size: 1.5rem; }
        }

        /* ESTADO MERCADO CERRADO */
        .disabled-slot { opacity: 0.45; cursor: not-allowed; }
        #marketClosedMsg {
            position: fixed; inset: 0; display: none; justify-content: center; align-items: center;
            z-index: 9000; pointer-events: none;
        }
        #marketClosedMsg .card {
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(17,17,17,0.96), rgba(22,22,22,0.96));
            border: 1px solid #333; padding: 20px 28px; border-radius: 12px; text-align: center; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        #marketClosedMsg .card i { font-size: 2rem; color: #ff5e00; margin-bottom: 8px; }
        #marketClosedMsg .card h2 { margin: 6px 0 0; font-size: 1.3rem; text-transform: uppercase; }
        #marketClosedMsg .card p { margin: 6px 0 0; color:#ccc; font-size:0.95rem; }
        #marketClosedMsg .card .market-close {
            position: absolute; top: 8px; right: 10px; background: transparent; border: none; color: #888; font-size: 1.4rem; cursor: pointer;
        }
        #marketClosedMsg .card .btn-small {
            margin-top: 12px; background: #ff5e00; color: white; border: none; padding: 8px 16px; border-radius: 999px; font-weight:700; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html"><i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span></a>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="nav-links" id="navLinks">
            <button class="menu-toggle" onclick="toggleMenu()" style="position: absolute; top: 20px; right: 20px; font-size: 2rem;"><i class="fa-solid fa-times"></i></button>
            <a href="home.html">INICIO</a>
            <a href="mi_equipo.html" class="active">MI EQUIPO</a>
            <a href="mercado.html">MERCADO</a>
            <a href="clasificaciones.html">RANKING</a>
            <a href="stats.html">ESTADÍSTICAS</a>
            <a href="calendario.html">CALENDARIO</a>
            <button onclick="cerrarSesion()" class="btn-logout"><i class="fa-solid fa-power-off"></i> Salir</button>
        </div> 
    </nav>

    <div class="budget-header">
        <div class="budget-content">
            <div style="display:flex; flex-direction:column;">
                <span class="budget-label">Presupuesto</span>
                <span id="budgetValue" class="budget-number">---</span>
            </div>
            <div id="debtWarning" class="debt-pill">⚠️ EN DEUDA</div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="pitch-area">
            <div style="text-align: center; margin-bottom: 15px; color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;">Tu Alineación (3)</div>
            <div class="pitch-bg">
                <div class="formation-wrapper">
                    <div class="formation-row">
                        <div id="slot0" class="player-card-slot"></div>
                    </div>
                    <div class="formation-row">
                        <div id="slot1" class="player-card-slot"></div>
                        <div id="slot2" class="player-card-slot"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="fab-save-container">
            <button id="btnSaveTeam" class="btn-save-fab" disabled>
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </button>
            <button id="btnShareTeam" class="btn-share-fab" disabled>
                <i class="fa-solid fa-share-nodes"></i> COMPARTIR EQUIPO
            </button>
        </div>
    </div>

    <div id="playerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color:white; margin:0; font-size:1.1rem; text-transform: uppercase;">Seleccionar Jugador</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div style="padding:15px; background:#1a1a1a;">
                <input type="text" id="modalSearch" placeholder="Buscar atleta..." style="width:100%; padding:15px; border-radius:50px; border:1px solid #333; background:#000; color:white; outline:none; font-size: 1rem;">
            </div>
            <div id="modalPlayerList" class="modal-body"></div>
        </div>
    </div>

        <div id="marketClosedMsg" aria-hidden="true">
            <div class="card">
                <button id="marketClosedClose" class="market-close" aria-label="Cerrar">&times;</button>
                <i class="fa-solid fa-lock"></i>
                <h2>Mercado cerrado</h2>
                <p><strong>Este es tu equipo</strong><br>Puedes verlo, pero no podrás modificarlo hasta que el mercado abra.</p>
                <button id="marketClosedDismiss" class="btn-small">Entendido</button>
            </div>
        </div>

    <script>
        function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }
        function cerrarSesion() { localStorage.removeItem('fantasy_user'); window.location.href = '../index.html'; }
        window.closeModal = function() { document.getElementById('playerModal').style.display = 'none'; };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBmwfxAGq6dzy6RegYcWQHd4XgDgn1QJiM",
            authDomain: "fantasy-atletismo-26.firebaseapp.com",
            projectId: "fantasy-atletismo-26",
            storageBucket: "fantasy-atletismo-26.firebasestorage.app",
            messagingSenderId: "133833651406",
            appId: "1:133833651406:web:4e2841f58fd2a288c30c9f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ESTADO ---
        let currentUserData = null;
        let allAthletes = [];
        let teamSlots = [null, null, null]; 
        let captainId = null;
        let totalPatrimony = 0;
        let currentSlotIndex = -1;
        let isMarketClosed = false;
        let overlayManuallyHidden = false;

        function checkMarketStatus() {
    const now = new Date();
    const day = now.getDay(); // 0=Domingo, 1=Lunes, 2=Martes... 6=Sábado
    const hour = now.getHours();

    // BLOQUEO:
    // Sábado (6), Domingo (0), Lunes (1) -> CERRADO TODO EL DÍA
    // Martes (2) -> CERRADO ANTES DE LAS 10:00 (hour < 10)
    
    if ( day === 6 || day === 0 || day === 1 )  {
        isMarketClosed = true;
        
        // Bloqueo Visual (Overlay)
        const overlay = document.getElementById('marketClosedMsg');
        if(overlay) {
            if (!overlayManuallyHidden) {
                overlay.style.display = 'flex';
                overlay.setAttribute('aria-hidden', 'false');
            } else {
                overlay.style.display = 'none';
                overlay.setAttribute('aria-hidden', 'true');
            }
        }

        // Bloqueo Botón Guardar
        const btn = document.getElementById('btnSaveTeam');
        if(btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-lock"></i> MERCADO CERRADO';
            btn.style.backgroundColor = "#333";
        }
        return false; // Mercado Cerrado
    }

    // SI NO ES NINGUNO DE ESOS DÍAS/HORAS -> ABIERTO
    isMarketClosed = false;
    overlayManuallyHidden = false; // reset manual hide when market reabre
    const overlay = document.getElementById('marketClosedMsg');
    if(overlay) {
        overlay.style.display = 'none';
        overlay.setAttribute('aria-hidden', 'true');
    }
    
    return true; // Mercado Abierto
} 

// Ejecutar al cargar y vigilar cambios periódicamente
checkMarketStatus();
setInterval(checkMarketStatus, 30000);

// Permitir cerrar el overlay manualmente (no reabrir hasta que el mercado cambie)
const dismissBtn = document.getElementById('marketClosedDismiss');
if (dismissBtn) dismissBtn.addEventListener('click', () => {
    const o = document.getElementById('marketClosedMsg');
    if (o) { o.style.display = 'none'; o.setAttribute('aria-hidden', 'true'); }
    overlayManuallyHidden = true;
});
const closeBtn = document.getElementById('marketClosedClose');
if (closeBtn) closeBtn.addEventListener('click', () => {
    const o = document.getElementById('marketClosedMsg');
    if (o) { o.style.display = 'none'; o.setAttribute('aria-hidden', 'true'); }
    overlayManuallyHidden = true;
});
            // 1. OBTENER ID USUARIO
            const userNick = localStorage.getItem('fantasy_user');
            
            if (!userNick) { 
                console.error("NO HAY USUARIO LOGUEADO. Redirigiendo...");
                // Si no hay user en localStorage, no podemos cargar nada real.
                // window.location.href = '../index.html'; // Descomenta en producción
                document.getElementById('btnSaveTeam').innerText = "ERROR: NO LOGIN";
            }

            console.log("Cargando datos para usuario:", userNick);

            if (userNick) {
                try {
                    // 2. CARGAR USUARIO REAL
                const userDoc = await getDoc(doc(db, "usuarios", userNick));
                
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    console.log("Datos de usuario cargados:", currentUserData);
                } else {
                    console.error("EL USUARIO NO EXISTE EN FIREBASE:", userNick);
                    alert("Error crítico: Tu usuario no se encuentra en la base de datos.");
                    document.getElementById('btnSaveTeam').innerText = "USUARIO NO VALIDO";
                    throw new Error("USUARIO NO VALIDO");
                }

                // 3. CARGAR ATLETAS
                const athSnap = await getDocs(collection(db, "atletas"));
                allAthletes = [];
                athSnap.forEach(d => {
                    let a = d.data();
                    a.id = d.id;
                    a.precio = parseInt(a.precio) || 0; 
                    allAthletes.push(a);
                });

                // 4. RECONSTRUIR EQUIPO
                const savedIds = currentUserData.equipo || [];
                captainId = currentUserData.capitanId || null;

                savedIds.forEach((id, index) => {
                    if (index < 3) {
                        const player = allAthletes.find(a => a.id === id);
                        if (player) teamSlots[index] = player;
                    }
                });

                // 5. CALCULAR PATRIMONIO REAL
                // El presupuesto en BD es el dinero "en caja".
                // El patrimonio total es (Dinero en caja) + (Valor jugadores)
                const teamValue = teamSlots.reduce((sum, p) => sum + (p ? p.precio : 0), 0);
                // Si presupuesto viene como string, convertir a int
                const dineroEnCaja = parseInt(currentUserData.presupuesto) || 0;
                
                // IMPORTANTE: Definimos el patrimonio total disponible para gastar
                totalPatrimony = dineroEnCaja + teamValue;

                console.log("Dinero en caja:", dineroEnCaja);
                console.log("Valor equipo:", teamValue);
                console.log("Patrimonio Total:", totalPatrimony);

                updateUI();

            } catch (error) {
                console.error("Error iniciando:", error);
                document.getElementById('btnSaveTeam').innerText = "ERROR: " + (error.message || "DE CONEXIÓN");
            }
        }

        function updateUI() {
            // Coste del equipo actual en pantalla
            const currentTeamCost = teamSlots.reduce((sum, p) => sum + (p ? p.precio : 0), 0);
            // Presupuesto restante = Patrimonio Total - Coste Equipo Actual
            const currentBudget = totalPatrimony - currentTeamCost;

            const budgetEl = document.getElementById('budgetValue');
            if(budgetEl) {
                budgetEl.innerText = Math.round(currentBudget) + "M"; 
                if (currentBudget < 0) {
                    budgetEl.classList.add('negative');
                    document.getElementById('debtWarning').style.display = 'block';
                } else {
                    budgetEl.classList.remove('negative');
                    document.getElementById('debtWarning').style.display = 'none';
                }
            }

            renderSlot(0, 'slot0');
            renderSlot(1, 'slot1');
            renderSlot(2, 'slot2');

            const btn = document.getElementById('btnSaveTeam');
            if(btn) {
                if (isMarketClosed) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-lock"></i> MERCADO CERRADO';
                    btn.style.backgroundColor = "#333";
                } else if (currentBudget < 0) {
                    btn.disabled = true;
                    btn.innerText = "DEUDA (Vende jugadores)";
                    btn.style.backgroundColor = "#e84118";
                } else {
                    btn.disabled = false;
                    btn.innerText = "GUARDAR ALINEACIÓN";
                    btn.style.backgroundColor = "#ff5e00";
                }
            }

            // Habilitar botón compartir si hay al menos 1 jugador
            const btnShare = document.getElementById('btnShareTeam');
            if(btnShare) {
                const hasPlayers = teamSlots.some(p => p !== null);
                btnShare.disabled = !hasPlayers;
            }
        }

        function renderSlot(index, elementId) {
            const container = document.getElementById(elementId);
            if(!container) return;
            const player = teamSlots[index];
            
            container.innerHTML = "";
            const disabledClass = isMarketClosed ? "disabled-slot" : "";
            container.className = "player-card-slot"; 

            if (player) {
                container.classList.add('filled'); if (isMarketClosed) container.classList.add('disabled-slot');
                const isCapi = (player.id === captainId);
                const capiClass = isCapi ? "active" : "";
                const imgUrl = player.foto || 'https://cdn-icons-png.flaticon.com/512/74/74472.png';

                const actionsHTML = isMarketClosed ? '' : `
                    <div class="card-actions">
                        <button class="btn-mini btn-captain ${capiClass}" data-action="cap" data-idx="${index}">C</button>
                        <button class="btn-mini btn-remove" data-action="rem" data-idx="${index}">X</button>
                    </div>
                `;

                container.innerHTML = `
                    <img src="${imgUrl}" class="slot-img">
                    <div class="slot-name">${player.nombre}</div>
                    <div class="slot-price">${player.precio}M</div>
                    ${actionsHTML}
                `;
            } else {
                container.className = `player-card-slot ${disabledClass}`;
                if(!isMarketClosed) {
                    container.innerHTML = `
                        <i class="fa-solid fa-plus" style="font-size: 1.5rem; color: #555;"></i>
                        <span style="font-size: 0.6rem; color: #666; margin-top:5px; font-weight:bold;">FICHAR</span>
                    `;
                    container.onclick = () => openModal(index);
                } else {
                    container.innerHTML = `
                        <i class="fa-solid fa-lock" style="font-size: 1.3rem; color: #ff5e00;"></i>
                        <div style="font-size:0.7rem; color:#ccc; margin-top:6px; font-weight:700; text-transform:uppercase;">Mercado cerrado</div>
                        <div style="font-size:0.6rem; color:#999; margin-top:4px;">Este es tu equipo</div>
                    `;
                    container.onclick = null;
                }
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target.matches('[data-action="cap"]')) {
                if(isMarketClosed) return; // No permitir cambios si está cerrado
                e.stopPropagation();
                const idx = e.target.getAttribute('data-idx');
                const p = teamSlots[idx];
                if(p) {
                    captainId = (captainId === p.id) ? null : p.id;
                    updateUI();
                }
            }
            if (e.target.matches('[data-action="rem"]')) {
                if(isMarketClosed) return; // No permitir cambios si está cerrado
                e.stopPropagation();
                const idx = e.target.getAttribute('data-idx');
                const p = teamSlots[idx];
                if (p && p.id === captainId) captainId = null;
                teamSlots[idx] = null;
                updateUI();
            }
        });

        window.openModal = function(index) {
            currentSlotIndex = index;
            renderMarketList();
            document.getElementById('playerModal').style.display = 'flex';
        }

        const searchInput = document.getElementById('modalSearch');
        if(searchInput) searchInput.addEventListener('keyup', renderMarketList);

        function renderMarketList() {
            const container = document.getElementById('modalPlayerList');
            const searchVal = document.getElementById('modalSearch').value.toLowerCase();
            container.innerHTML = "";

            const usedIds = teamSlots.filter(p => p).map(p => p.id);
            const available = allAthletes.filter(a => {
                const matchName = (a.nombre + ' ' + (a.apellidos || '')).toLowerCase().includes(searchVal);
                return !usedIds.includes(a.id) && matchName;
            });

            available.sort((a,b) => b.precio - a.precio);

            available.forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-list-item';
                div.innerHTML = `
                    <img src="${p.foto || 'https://cdn-icons-png.flaticon.com/512/74/74472.png'}">
                    <div style="flex-grow:1;">
                        <div style="color:white; font-weight:bold; font-size:0.9rem;">${p.nombre} ${p.apellidos || ''}</div>
                        <div style="color:#4cd137; font-size:0.8rem; font-weight:600;">${p.precio}M</div>
                    </div>
                    <i class="fa-solid fa-plus-circle" style="color:#ff5e00; font-size:1.5rem;"></i>
                `;
                div.onclick = () => selectPlayer(p);
                container.appendChild(div);
            });
        }

        function selectPlayer(player) {
            teamSlots[currentSlotIndex] = player;
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('modalSearch').value = "";
            updateUI();
        }

        const btnSave = document.getElementById('btnSaveTeam');
        if(btnSave) {
            btnSave.addEventListener('click', async () => {
                if (isMarketClosed) {
                    btnSave.innerHTML = '<i class="fa-solid fa-lock"></i> MERCADO CERRADO';
                    btnSave.disabled = true;
                    return;
                }

                btnSave.innerText = "GUARDANDO...";
                btnSave.disabled = true;

                try {
                    const userNick = localStorage.getItem('fantasy_user');
                    // IMPORTANTE: Calculamos el nuevo presupuesto (Dinero en caja)
                    // Nuevo Presupuesto = Patrimonio Total - Valor Jugadores Actuales
                    const currentTeamCost = teamSlots.reduce((sum, p) => sum + (p ? p.precio : 0), 0);
                    const finalBudget = totalPatrimony - currentTeamCost;
                    
                    const teamIds = teamSlots.filter(p => p).map(p => p.id);

                    await updateDoc(doc(db, "usuarios", userNick), {
                        equipo: teamIds,
                        capitanId: captainId || null,
                        presupuesto: Math.round(finalBudget)
                    });

                    btnSave.style.backgroundColor = "#4cd137";
                    btnSave.innerText = "¡GUARDADO!";
                    
                    // Actualizar datos locales para reflejar el cambio sin recargar
                    currentUserData.presupuesto = finalBudget;
                    currentUserData.equipo = teamIds;
                    
                    setTimeout(() => {
                        updateUI(); // Restaurar botón
                    }, 1500);

                } catch (e) {
                    console.error("Error al guardar:", e);
                    btnSave.innerText = "ERROR AL GUARDAR";
                    btnSave.style.backgroundColor = "#e84118";
                    
                    setTimeout(() => {
                        updateUI();
                    }, 2000);
                }
            });
        }

        // ============ GENERAR IMAGEN DEL EQUIPO ============
        async function generarImagenEquipo() {
    try {
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1350;
        const ctx = canvas.getContext('2d');

        // Helper para bordes redondeados
        function drawRoundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // 1. FONDO "NEXO CIBERNÉTICO" (Ajustado para más visibilidad)
        ctx.fillStyle = '#050505'; // Base negra casi pura
        ctx.fillRect(0, 0, 1080, 1350);

        // --- AJUSTE AQUÍ ---
        // Patrón geométrico hexagonal sutil pero visible
        // Antes era #151515 (muy oscuro), ahora #252525 (un pelín más claro)
        ctx.strokeStyle = '#252525'; 
        ctx.lineWidth = 2;
        const hexSize = 60;
        const h = hexSize * Math.sqrt(3);
        for (let y = -h; y < 1350 + h; y += h) {
            for (let x = 0; x < 1080 + hexSize * 3; x += hexSize * 3) {
                ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x + hexSize * 0.5, y + h * 0.5);
                ctx.lineTo(x + hexSize * 1.5, y + h * 0.5); ctx.lineTo(x + hexSize * 2, y);
                ctx.lineTo(x + hexSize * 1.5, y - h * 0.5); ctx.lineTo(x + hexSize * 0.5, y - h * 0.5);
                ctx.closePath(); ctx.stroke();
            }
        }

        // Viñeteado oscuro para centrar la vista (mantiene el misterio en los bordes)
        const vignette = ctx.createRadialGradient(540, 675, 100, 540, 675, 950);
        vignette.addColorStop(0, 'transparent');
        vignette.addColorStop(1, '#000000');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, 1080, 1350);


        // 2. HEADER CINEMATOGRÁFICO
        // Línea de horizonte de luz naranja
        const horizonGlow = ctx.createLinearGradient(0, 180, 1080, 180);
        horizonGlow.addColorStop(0, 'transparent');
        horizonGlow.addColorStop(0.5, '#ff5e00');
        horizonGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(100, 178, 880, 4);

        // Título con espaciado amplio
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 70px Montserrat';
        ctx.textAlign = 'center';
        if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '12px'; // Espaciado épico
        ctx.fillText('MI EQUIPO', 540, 140);
        if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';

        // Mánager
        const managerName = currentUserData.nombre_usuario?.toUpperCase() || 'MANAGER';
        ctx.fillStyle = '#ff5e00';
        ctx.font = 'bold 24px Montserrat';
        if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '2px';
        ctx.fillText(`@${managerName} / FANTASY ORCASITAS`, 540, 220);
        if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';


        // 3. CONFIGURACIÓN DE TARJETAS
        const cardW = 300;
        const cardH = 400;
        const topCardCy = 500;
        const bottomCardsCy = 940;

        const positions = [
            { cx: 540, cy: topCardCy }, // Capitán
            { cx: 350, cy: bottomCardsCy }, // Izquierda
            { cx: 730, cy: bottomCardsCy }  // Derecha
        ];

        // --- LÍNEAS DE ENERGÍA DE CONEXIÓN ---
        ctx.strokeStyle = '#ff5e00';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff5e00'; ctx.shadowBlur = 20; // Luz intensa
        ctx.beginPath();
        // Del header al capitán
        ctx.moveTo(540, 230); ctx.lineTo(540, topCardCy - cardH/2);
        // Del capitán a los atletas
        ctx.moveTo(540, topCardCy + cardH/2); ctx.lineTo(540, (topCardCy + bottomCardsCy)/2);
        ctx.lineTo(350, (topCardCy + bottomCardsCy)/2); ctx.lineTo(350, bottomCardsCy - cardH/2);
        ctx.moveTo(540, (topCardCy + bottomCardsCy)/2); ctx.lineTo(730, (topCardCy + bottomCardsCy)/2); ctx.lineTo(730, bottomCardsCy - cardH/2);
        ctx.stroke();
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

        
        // 4. DIBUJAR JUGADORES (Estilo Cristal Oscuro)
        for (let i = 0; i < teamSlots.length; i++) {
            const player = teamSlots[i];
            const pos = positions[i];

            if (player) {
                const isRealCapi = player.id === captainId;
                const startX = pos.cx - cardW / 2;
                const startY = pos.cy - cardH / 2;

                // A. Resplandor trasero
                const glowRadius = isRealCapi ? 300 : 200;
                const glowColor = isRealCapi ? 'rgba(255, 94, 0, 0.25)' : 'rgba(255, 94, 0, 0.1)';
                const cardGlow = ctx.createRadialGradient(pos.cx, pos.cy, 50, pos.cx, pos.cy, glowRadius);
                cardGlow.addColorStop(0, glowColor);
                cardGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = cardGlow;
                ctx.fillRect(startX - 100, startY - 100, cardW + 200, cardH + 200);

                // B. Fondo de la tarjeta "Cristal Oscuro" (Semitransparente para ver el fondo mejorado)
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 10;
                drawRoundRect(ctx, startX, startY, cardW, cardH, 20);
                // Un gris muy oscuro pero con opacidad
                ctx.fillStyle = 'rgba(20, 20, 24, 0.92)'; 
                ctx.fill();
                ctx.shadowColor = 'transparent';

                // C. Borde de luz
                ctx.lineWidth = 3;
                ctx.strokeStyle = isRealCapi ? '#ff5e00' : 'rgba(255, 94, 0, 0.5)';
                if(isRealCapi) { ctx.shadowColor = '#ff5e00'; ctx.shadowBlur = 15; }
                ctx.stroke();
                ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

                // D. Foto
                const imgRadius = 70;
                const imgY = startY + 110;
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = player.foto || 'https://cdn-icons-png.flaticon.com/512/74/74472.png';
                
                await new Promise((resolve) => {
                    img.onload = () => {
                        ctx.save(); ctx.beginPath(); ctx.arc(pos.cx, imgY, imgRadius, 0, Math.PI * 2); ctx.closePath();
                        ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                        ctx.clip(); ctx.drawImage(img, pos.cx - imgRadius, imgY - imgRadius, imgRadius*2, imgRadius*2);
                        ctx.restore(); resolve();
                    };
                    img.onerror = () => {
                        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(pos.cx, imgY, imgRadius, 0, Math.PI*2); ctx.fill();
                        ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke(); resolve();
                    };
                });

                // E. Textos
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 32px Montserrat';
                const primerNombre = player.nombre.split(' ')[0].toUpperCase(); 
                ctx.fillText(primerNombre, pos.cx, startY + 230);

                // F. Precio (con barra de progreso visual)
                ctx.fillStyle = '#4cd137'; ctx.font = 'bold 26px Montserrat';
                ctx.fillText(`${player.precio} M`, pos.cx, startY + 275);
                // Barra de valor visual
                const barW = 180; const barH = 6; const barY = startY + 295;
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(pos.cx - barW/2, barY, barW, barH); // Fondo barra
                const valueRatio = Math.min(player.precio / 60, 1);
                ctx.fillStyle = '#4cd137'; ctx.fillRect(pos.cx - barW/2, barY, barW * valueRatio, barH); // Progreso

                // G. Insignia 'C' (Estilo botón de energía)
                if (isRealCapi) {
                    const badgeY = startY + 345;
                    ctx.shadowColor = '#ff5e00'; ctx.shadowBlur = 20;
                    ctx.beginPath(); ctx.arc(pos.cx, badgeY, 25, 0, Math.PI*2);
                    ctx.fillStyle = '#ff5e00'; ctx.fill();
                    ctx.shadowColor = 'transparent';
                    ctx.fillStyle = '#ffffff'; ctx.font = '900 28px Montserrat'; ctx.fillText('C', pos.cx, badgeY + 10);
                }
            }
        }

        // 5. FOOTER
        const currentTeamCost = teamSlots.reduce((sum, p) => sum + (p ? p.precio : 0), 0);
        
        // Línea de cierre
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(300, 1250, 480, 3);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px Montserrat';
        if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '2px';
        ctx.fillText(`VALOR TOTAL: ${currentTeamCost} M`, 540, 1300);
        if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';

        // 6. COMPARTIR
        canvas.toBlob(async (blob) => {
            try {
                const shareData = {
                    title: 'Mi Equipo Fantasy',
                    text: `🔥 ¡Echa un vistazo a mi equipo en Fantasy Orcasitas!\n\nValor: ${currentTeamCost}M`,
                    files: [new File([blob], 'mi-equipo.png', { type: 'image/png' })]
                };
                if (navigator.canShare && navigator.canShare(shareData)) { await navigator.share(shareData); } else {
                    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `equipo-${currentUserData.nombre_usuario || 'fantasy'}.png`; a.click(); URL.revokeObjectURL(url); alert('✅ Imagen descargada.');
                }
            } catch (e) { console.error('Error:', e); }
        });
    } catch (error) { console.error('Error:', error); alert('Error: ' + error.message); }
}
        const btnShare = document.getElementById('btnShareTeam');
        if (btnShare) {
            btnShare.addEventListener('click', () => {
                if (teamSlots.filter(p => p).length === 0) {
                    alert('Necesitas al menos 1 jugador.');
                    return;
                }
                btnShare.disabled = true;
                btnShare.innerText = 'Generando...';
                generarImagenEquipo().finally(() => {
                    btnShare.disabled = false;
                    btnShare.innerHTML = '<i class="fa-solid fa-share-nodes"></i> COMPARTIR EQUIPO';
                });
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
