<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Equipo | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* --- ARREGLO DE EMERGENCIA PARA MÓVIL --- */
        
        /* 1. Reset para que nada se salga de la pantalla */
        html, body {
            overflow-x: hidden !important; /* Prohibido scroll horizontal */
            width: 100%;
            background-color: #0a0a0a;
        }

        .dashboard-container {
            width: 100%;
            padding: 10px;
            padding-bottom: 120px; /* Espacio para el botón flotante */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* 2. BARRA DE PRESUPUESTO */
        /* La sacamos del sticky problemático y la ponemos fija pero limpia */
        .budget-header {
            background: #111;
            border-bottom: 1px solid #333;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 50;
        }

        .budget-content {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .budget-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .budget-number { font-size: 1.5rem; font-weight: 700; color: white; font-family: 'Montserrat', sans-serif; }
        .budget-number.positive { color: #4cd137; }
        .budget-number.negative { color: #e84118; }

        .debt-pill {
            background: rgba(232, 65, 24, 0.2);
            color: #e84118;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            display: none;
            border: 1px solid rgba(232, 65, 24, 0.5);
        }

        /* 3. EL CAMPO (PIZARRA) - AHORA RESPONSIVE */
        .pitch-area {
            width: 100%;
            max-width: 500px; /* No más ancho que esto */
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pitch-bg {
            width: 100%;
            background: linear-gradient(180deg, #151515 0%, #0f0f0f 100%);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px 10px; /* Menos padding lateral */
            position: relative;
            box-sizing: border-box; /* CLAVE: Para que el padding no ensanche la caja */
            
            /* Dibujo sutil de líneas */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* FORMACIÓN Y CARTAS */
        .formation-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .formation-row {
            display: flex;
            justify-content: center;
            gap: 20px; /* Separación más pequeña para que quepan */
            width: 100%;
        }

        /* LAS CARTAS DE JUGADOR (SLOTS) */
        .player-card-slot {
            width: 90px;
            height: 130px;
            background: rgba(255,255,255,0.03);
            border: 2px dashed #444;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            /* Aseguramos que no se rompa */
            flex-shrink: 0; 
        }

        /* Ajuste para móviles muy pequeños */
        @media (max-width: 380px) {
            .player-card-slot { width: 80px; height: 120px; }
            .formation-row { gap: 10px; }
        }

        .player-card-slot.filled { border: 2px solid var(--primary); background: #1a1a1a; cursor: default; }
        
        .slot-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; margin-bottom: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .slot-name { font-size: 0.7rem; color: white; font-weight: bold; text-align: center; line-height: 1.1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 75px; }
        .slot-price { font-size: 0.65rem; color: #4cd137; margin-bottom: 5px; }

        /* BOTONES DENTRO DE LA CARTA */
        .card-actions { display: flex; gap: 4px; margin-top: 4px; }
        .btn-mini { border: none; border-radius: 4px; padding: 2px 5px; font-size: 0.6rem; cursor: pointer; font-weight: bold; }
        .btn-remove { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid #ff3b30; }
        .btn-captain { background: transparent; color: #666; border: 1px solid #666; }
        .btn-captain.active { background: #f1c40f; color: black; border-color: #f1c40f; box-shadow: 0 0 8px rgba(241, 196, 15, 0.4); }

        /* BOTÓN FLOTANTE GUARDAR */
        .fab-save-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }

        .btn-save-fab {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(255, 94, 0, 0.3);
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-save-fab:active { transform: scale(0.98); }
        .btn-save-fab:disabled { background: #444; color: #888; box-shadow: none; }

        /* NAVBAR MÓVIL ESTILOS */
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; padding: 15px; }
            .nav-logo { flex-grow: 1; }
            .menu-toggle { display: block; margin-left: 15px; }
            .nav-links { display: none; width: 100%; flex-direction: column; margin-top: 15px; background: rgba(0,0,0,0.95); border-radius: 8px; padding: 10px; border: 1px solid #333; position: relative; z-index: 9999;}
            .nav-links.active { display: flex; }
            .nav-links a { padding: 15px; border-bottom: 1px solid #222; text-align: center; width: 100%; display: block; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div id="marketClosedMsg" class="market-closed-overlay" style="display: none;">
        <i class="fa-solid fa-lock" style="font-size: 4rem; color: #e84118; margin-bottom: 20px;"></i>
        <h2>MERCADO CERRADO</h2>
        <a href="home.html" class="btn-action" style="margin-top: 20px; width: auto; text-decoration: none;">Volver</a>
    </div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>
        <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
        <button onclick="localStorage.removeItem('fantasy_user'); window.location.href='../index.html'" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;"><i class="fa-solid fa-power-off"></i></button>
        
        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html" class="active">Mi Equipo</a>
            <a href="mercado.html">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="budget-header">
        <div class="budget-content">
            <div style="display:flex; flex-direction:column;">
                <span class="budget-label">Presupuesto</span>
                <span id="budgetValue" class="budget-number">---</span>
            </div>
            
            <div id="debtWarning" class="debt-pill">
                ⚠️ EN DEUDA
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        
        <div class="pitch-area">
            <div style="text-align: center; margin-bottom: 10px; color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
                Tu Alineación (3)
            </div>

            <div class="pitch-bg">
                <div class="formation-wrapper">
                    <div class="formation-row">
                        <div id="slot0" class="player-card-slot"></div>
                    </div>
                    <div class="formation-row">
                        <div id="slot1" class="player-card-slot"></div>
                        <div id="slot2" class="player-card-slot"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="fab-save-container">
            <button id="btnSaveTeam" class="btn-save-fab">
                <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
            </button>
        </div>

    </div>

    <div id="playerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color:white; margin:0; font-size:1.1rem;">Seleccionar Jugador</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
            </div>
            <div style="padding:10px; background:#1a1a1a;">
                <input type="text" id="modalSearch" onkeyup="filtrarModal()" placeholder="Buscar atleta..." 
                       style="width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#000; color:white; outline:none;">
            </div>
            <div id="modalPlayerList" class="modal-body" style="max-height: 60vh;">
                </div>
        </div>
    </div>

    <script type="module" src="../js/mi_equipo.js"></script>
</body>
</html>
