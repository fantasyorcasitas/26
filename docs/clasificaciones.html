<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clasificación | Fantasy Athletics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>TRACK</span>
            </a>
            <button onclick="window.location.href='../login.html'" class="btn-logout" style="font-size: 1.2rem;">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
        
        <div class="nav-links">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html">Mercado</a>
            <a href="clasificaciones.html" class="active">Ranking</a>
            <a href="calendario.html">Calendario</a>
            <a href="stats.html">Stats</a>
        </div>
    </nav>

    <div class="dashboard-container2" style="flex-direction: column; align-items: center; padding-top: 100px;">
        
        <div class="rankings-wrapper">
            
            <div class="ranking-card">
                <div class="ranking-title"><i class="fa-solid fa-users"></i> Managers</div>
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th class="rank-col">#</th>
                            <th>Nombre</th>
                            <th style="text-align: right;">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="managersBody">
                        </tbody>
                </table>
            </div>

            <div class="ranking-card">
                <div class="ranking-title"><i class="fa-solid fa-medal"></i> Atletas</div>
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th class="rank-col">#</th>
                            <th>Atleta</th>
                            <th style="text-align: right;">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="atletasBody">
                        </tbody>
                </table>
            </div>

        </div>
    </div>

    <script type="module" src="../js/clasificaciones.js"></script>
</body>
</html>
