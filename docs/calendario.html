<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        html, body { overflow-y: auto !important; height: auto !important; min-height: 100vh; }
        .dashboard-container { padding-top: 90px; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; }

        /* Estilos Tarjetas Competición */
        .compe-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }
        .compe-header {
            padding: 15px;
            background: linear-gradient(90deg, #1a1a1a, #111);
            border-bottom: 1px solid #222;
        }
        .compe-date { color: var(--primary); font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .compe-name { color: white; font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .compe-location { color: #888; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }

        /* Estado */
        .status-badge {
            position: absolute; top: 15px; right: 15px;
            padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
        }
        .status-pending { background: rgba(255, 174, 0, 0.2); color: #ffae00; border: 1px solid #ffae00; }
        .status-finished { background: rgba(76, 209, 55, 0.2); color: #4cd137; border: 1px solid #4cd137; }

        /* Detalles (Acordeón) */
        details { width: 100%; max-width: 600px; margin-bottom: 10px; }
        summary {
            background: #222; color: white; padding: 15px; border-radius: 8px;
            cursor: pointer; font-weight: bold; border: 1px solid #333;
            list-style: none; display: flex; justify-content: space-between; align-items: center;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.8rem; color: #666; }
        details[open] summary::after { content: '▲'; }

        /* Tabla de Resultados dentro de la tarjeta */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            color: #ddd;
        }
        .results-table th { text-align: left; color: #888; padding: 10px; border-bottom: 1px solid #333; font-size: 0.7rem; text-transform: uppercase; }
        .results-table td { padding: 10px; border-bottom: 1px solid #222; }
        .results-table tr:last-child td { border-bottom: none; }
        .res-mark { color: white; font-weight: bold; }
        .res-pts { color: var(--primary); font-weight: 800; text-align: right; }

        /* Sección Oculta de Finalizadas */
        .history-section {
            width: 100%; max-width: 600px; margin-top: 40px; border-top: 1px solid #333; padding-top: 20px;
        }
        .history-title { color: #666; font-size: 1rem; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        /* Navbar móvil */
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; }
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; padding: 15px; }
            .nav-logo { flex-grow: 1; }
            .menu-toggle { display: block; margin-left: 15px; }
            .nav-links { display: none; width: 100%; flex-direction: column; margin-top: 15px; background: rgba(0,0,0,0.95); padding: 10px; border: 1px solid #333; border-radius: 8px;}
            .nav-links.active { display: flex; }
            .nav-links a { padding: 15px; border-bottom: 1px solid #222; text-align: center; width: 100%; display: block; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>
        <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
        <button onclick="localStorage.removeItem('fantasy_user'); window.location.href='../index.html'" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;"><i class="fa-solid fa-power-off"></i></button>
        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html" class="active">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <h1 style="color:white; margin-bottom: 20px; text-transform: uppercase;">Próximas Competiciones</h1>
        
        <div id="pendingList" style="width: 100%; max-width: 600px;">
            <p style="color:#666; text-align:center;">Cargando...</p>
        </div>

        <div class="history-section">
            <details>
                <summary>VER RESULTADOS ANTERIORES</summary>
                <div id="finishedList" style="margin-top: 20px;">
                    </div>
            </details>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmwfxAGq6dzy6RegYcWQHd4XgDgn1QJiM",
            authDomain: "fantasy-atletismo-26.firebaseapp.com",
            projectId: "fantasy-atletismo-26",
            storageBucket: "fantasy-atletismo-26.firebasestorage.app",
            messagingSenderId: "133833651406",
            appId: "1:133833651406:web:4e2841f58fd2a288c30c9f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadCalendar() {
            const pendingContainer = document.getElementById('pendingList');
            const finishedContainer = document.getElementById('finishedList');
            
            pendingContainer.innerHTML = '<p style="text-align:center; color:#666;">Cargando...</p>';
            finishedContainer.innerHTML = '';

            try {
                // Ordenar por fecha
                const q = query(collection(db, "competiciones"), orderBy("fecha", "asc"));
                const snapshot = await getDocs(q);
                
                let pendingHTML = '';
                let finishedHTML = '';

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const fechaObj = new Date(data.fecha);
                    const fechaStr = fechaObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });

                    if (data.estado === 'finalizada') {
                        // TARJETA DE FINALIZADA (CON RESULTADOS)
                        let rows = '';
                        if(data.participantes && data.participantes.length > 0) {
                            // Ordenar por puntos (mejor rendimiento arriba)
                            const sorted = data.participantes.sort((a,b) => b.puntos - a.puntos);
                            
                            sorted.forEach(p => {
                                rows += `
                                    <tr>
                                        <td class="res-mark">${p.resultado || '-'}</td>
                                        <td>
                                            <div style="color:white; font-weight:bold;">${p.nombre_completo}</div>
                                            <div style="color:#666; font-size:0.75rem;">${p.prueba}</div>
                                        </td>
                                        <td class="res-pts">+${p.puntos}</td>
                                    </tr>
                                `;
                            });
                        } else {
                            rows = '<tr><td colspan="3" style="text-align:center; color:#666;">Sin datos detallados</td></tr>';
                        }

                        finishedHTML += `
                            <div class="compe-card">
                                <div class="compe-header">
                                    <div class="status-badge status-finished">FINALIZADA</div>
                                    <div class="compe-date">${fechaStr}</div>
                                    <div class="compe-name">${data.nombre}</div>
                                    <div class="compe-location"><i class="fa-solid fa-location-dot"></i> ${data.lugar}</div>
                                </div>
                                <div style="padding: 10px; background: #151515;">
                                    <table class="results-table">
                                        <thead><tr><th>Marca/Pos</th><th>Atleta</th><th style="text-align:right;">Pts</th></tr></thead>
                                        <tbody>${rows}</tbody>
                                    </table>
                                </div>
                            </div>
                        `;

                    } else {
                        // TARJETA PENDIENTE (NORMAL)
                        const pruebas = data.pruebas_resumen ? `<div style="margin-top:10px; font-size:0.8rem; color:#aaa;"><i class="fa-solid fa-list"></i> ${data.pruebas_resumen}</div>` : '';
                        
                        pendingHTML += `
                            <div class="compe-card">
                                <div class="compe-header">
                                    <div class="status-badge status-pending">PENDIENTE</div>
                                    <div class="compe-date">${fechaStr}</div>
                                    <div class="compe-name">${data.nombre}</div>
                                    <div class="compe-location"><i class="fa-solid fa-location-dot"></i> ${data.lugar}</div>
                                    ${pruebas}
                                </div>
                            </div>
                        `;
                    }
                });

                pendingContainer.innerHTML = pendingHTML || '<p style="text-align:center; color:#666;">No hay competiciones pendientes.</p>';
                finishedContainer.innerHTML = finishedHTML || '<p style="text-align:center; color:#666;">Aún no hay resultados.</p>';

            } catch (error) {
                console.error(error);
                pendingContainer.innerHTML = '<p style="color:red; text-align:center;">Error al cargar calendario.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadCalendar);
    </script>
</body>
</html>
