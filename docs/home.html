<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>TRACK</span>
            </a>
            <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem;">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
        
        <div class="nav-links">
            <a href="home.html" class="active">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
            <a href="stats.html">Stats</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div class="login-card" style="width: 100%; max-width: 600px; padding: 2rem 1rem;">
            
            <div id="todayDate" class="date-display">Cargando fecha...</div>

            <h2 style="font-size: 1.8rem; margin-top: 15px; text-transform: uppercase;">
                Próxima <span>Jornada</span>
            </h2>
            
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">
                <i class="fa-regular fa-clock"></i> Cierre: Viernes 23:59
            </p>

            <div class="countdown-container">
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">Días</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">Horas</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">Min</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">Seg</span>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <a href="mi_equipo.html" class="btn-login" style="text-decoration: none; display: inline-flex; width: auto; padding: 12px 30px; font-size: 0.9rem;">
                    <i class="fa-solid fa-users-gear" style="margin-right: 8px;"></i> Gestionar Equipo
                </a>
            </div>
            
            <div style="margin-top: 20px; font-size: 0.8rem; color: #888;">
                Usuario: <span id="userNick" style="color: var(--primary); font-weight: bold;">Invitado</span>
            </div>
        </div>

    </div>

    <script>
        // 1. Mostrar Usuario
        const user = localStorage.getItem('fantasy_user');
        if(user) document.getElementById('userNick').innerText = user;

        // 2. Fecha Actual
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
        const today = new Date().toLocaleDateString('es-ES', dateOptions);
        document.getElementById('todayDate').innerText = today.charAt(0).toUpperCase() + today.slice(1);

        // 3. Lógica del Contador (Próximo Viernes 23:59)
        function updateCountdown() {
            const now = new Date();
            const target = new Date();
            
            // 5 = Viernes. Calculamos cuántos días faltan.
            let daysUntilFriday = 5 - now.getDay();
            
            // Si ya pasamos el viernes a las 23:59, apuntamos al de la semana que viene
            if (daysUntilFriday < 0 || (daysUntilFriday === 0 && now.getHours() >= 23 && now.getMinutes() >= 59)) {
                daysUntilFriday += 7;
            }
            
            target.setDate(now.getDate() + daysUntilFriday);
            target.setHours(23, 59, 59, 0);

            const diff = target - now;

            if (diff <= 0) {
                // Reset a 00 si se acabó
                ['days', 'hours', 'minutes', 'seconds'].forEach(id => document.getElementById(id).innerText = "00");
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            // Formato con ceros (05 en vez de 5)
            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. Cerrar Sesión
        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
