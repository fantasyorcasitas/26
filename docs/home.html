<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* --- ESTILOS RESPONSIVE (MÓVIL) --- */
        
        /* Por defecto el botón hamburguesa está oculto */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* AJUSTES PARA PANTALLAS PEQUEÑAS (Móviles) */
        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap; /* Permite que los elementos bajen si no caben */
                padding: 15px;
            }

            .nav-logo {
                flex-grow: 1; /* El logo ocupa el espacio disponible */
            }

            .menu-toggle {
                display: block; /* Mostramos el botón hamburguesa */
                margin-left: 15px;
            }

            .nav-links {
                display: none; /* Ocultamos los enlaces por defecto */
                width: 100%;
                flex-direction: column;
                margin-top: 15px;
                background: rgba(0, 0, 0, 0.9);
                border-radius: 8px;
                padding: 10px;
                border: 1px solid #333;
            }

            /* Clase que añadiremos con JS para mostrar el menú */
            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 15px;
                border-bottom: 1px solid #222;
                text-align: center;
                width: 100%;
                display: block;
            }

            /* Ajuste del contador para que no se rompa */
            .countdown-container {
                gap: 10px;
            }

            .time-box {
                min-width: 60px;
                padding: 10px;
            }
            
            .time-number {
                font-size: 1.5rem;
            }

            .login-card {
                margin: 0 15px; /* Margen lateral para que no toque los bordes */
                width: auto;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        
        <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;">
            <i class="fa-solid fa-power-off"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="home.html" class="active">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div class="login-card" style="width: 100%; max-width: 600px; padding: 2rem 1rem;">
            
            <div id="todayDate" class="date-display">Cargando fecha...</div>

            <h3 style="color: #ff5e00; margin-top: 10px;">Hola manager</span></h3>

            <h2 style="font-size: 1.8rem; margin-top: 15px; text-transform: uppercase;">
                Próxima <span>Jornada</span>
            </h2>
            
            <p style="color: #aaa; font-size: 0.9rem; margin-top: 5px;">
                <i class="fa-regular fa-clock"></i> Cierre: Viernes 23:59
            </p>

            <div class="countdown-container">
                <div class="time-box">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">Días</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">Horas</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">Min</span>
                </div>
                <div class="time-box">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">Seg</span>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <a href="mi_equipo.html" class="btn-login" style="text-decoration: none; display: inline-flex; width: auto; padding: 12px 30px; font-size: 0.9rem;">
                    <i class="fa-solid fa-users-gear" style="margin-right: 8px;"></i> Gestionar Equipo
                </a>
            </div>
            
        </div>

    </div>

    <script>
        // --- 1. LÓGICA DEL MENÚ MÓVIL ---
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        // --- 2. MOSTRAR USUARIO ---
        const user = localStorage.getItem('fantasy_user');
        if(user) {
            const nickElement = document.getElementById('userNick');
            if(nickElement) nickElement.innerText = user;
        }

        // --- 3. FECHA ACTUAL ---
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
        const today = new Date().toLocaleDateString('es-ES', dateOptions);
        document.getElementById('todayDate').innerText = today.charAt(0).toUpperCase() + today.slice(1);

        // --- 4. CONTADOR (Cuenta atrás) ---
        function updateCountdown() {
            const now = new Date();
            const target = new Date();
            
            // 5 = Viernes. 
            let daysUntilFriday = 5 - now.getDay();
            
            // Si ya pasó el viernes (ej: es sábado - 6), sumamos para el siguiente
            if (daysUntilFriday < 0 || (daysUntilFriday === 0 && now.getHours() >= 23 && now.getMinutes() >= 59)) {
                daysUntilFriday += 7;
            }
            
            target.setDate(now.getDate() + daysUntilFriday);
            target.setHours(23, 59, 59, 0);

            const diff = target - now;

            if (diff <= 0) {
                ['days', 'hours', 'minutes', 'seconds'].forEach(id => document.getElementById(id).innerText = "00");
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- 5. CERRAR SESIÓN ---
        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html'; // O login.html según donde lo tengas
        }
    </script>
</body>
</html>
