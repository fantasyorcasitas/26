<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

<style>
        /* =========================================
           1. RESET Y ESTRUCTURA (ANTI-CONFLICTOS)
           ========================================= */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
            background-color: #000 !important; 
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Quitamos el padding gigante del style.css global */
        .dashboard-container {
            padding-top: 20px !important; 
            padding-bottom: 100px !important;
            height: auto !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 0 !important;
        }

        /* =========================================
           2. NAVBAR ROBUSTA (A PRUEBA DE FALLOS)
           ========================================= */
        .navbar {
            /* Usamos STICKY: Se queda fija arriba pero OCUPA espacio real (no tapa el contenido) */
            position: sticky !important;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000 !important;
            padding: 15px 20px !important;
            border-bottom: 2px solid #222 !important;
            width: 100%;
            z-index: 9999; /* Muy alto para estar encima de todo */
            height: auto !important;
        }

        .nav-logo a {
            font-size: 1.2rem;
            font-weight: 800;
            color: white !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-logo span { color: #ff5e00 !important; }

        /* Estilos PC */
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #aaa !important;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
            white-space: nowrap; /* Evita que el texto se parta */
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ff5e00 !important;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #ff5e00 !important;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 15px;
        }

        /* Botón Hamburguesa (Móvil) */
        .menu-toggle {
            display: none; 
            background: none;
            border: none;
            color: white !important;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        /* =========================================
           3. ESTILOS TARJETAS (FANTASY)
           ========================================= */
        h1 { color: white; margin-bottom: 20px; text-transform: uppercase; text-align: center; font-size: 1.5rem; }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            padding: 0 15px;
        }
        
        #buscadorAtleta {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 50px;
            border: 1px solid #444;
            background: #151515;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
        }

        /* Tarjeta */
        .athlete-card {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .athlete-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .athlete-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ff5e00;
            object-fit: cover;
            background-color: #222;
        }

        .athlete-info h3 {
            margin: 0;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .badge-cat {
            background-color: #333;
            color: #ff5e00;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            width: fit-content;
            margin-top: 5px;
        }

        .price-tag {
            color: #4ade80; 
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 5px;
        }

        /* Stats */
        .stats-summary {
            display: flex;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 12px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
        }

        .stat-box {
            width: 33%;
            text-align: center;
            border-right: 1px solid #333;
        }
        .stat-box:last-child { border-right: none; }

        .stat-label {
            display: block;
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-num {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        /* Botones e Historial */
        .toggle-btn {
            text-align: center;
            color: #ff5e00;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px;
        }
        .toggle-btn:hover { text-decoration: underline; }

        .historial-desplegable {
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 15px;
            animation: fadeIn 0.3s;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background-color: #222;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .grid-value { color: white; font-weight: bold; font-size: 0.9rem; }
        .grid-label { color: #666; font-size: 0.6rem; }
        .section-label { color: #aaa; font-size: 0.7rem; display: block; margin-bottom: 5px; text-transform: uppercase;}

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* =========================================
           4. RESPONSIVE MÓVIL (CORRECCIÓN MENU ABSOLUTO)
           ========================================= */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px !important;
                /* IMPORTANTE: Relative para que el menú absoluto se posicione respecto a esto */
                position: relative !important; 
            }
            
            .nav-logo { flex-grow: 1; }
            .menu-toggle { display: block !important; } 
            
            /* Menú desplegable flotante (Overlay) */
            .nav-links {
                display: none; 
                position: absolute; /* FLOTA SOBRE EL CONTENIDO */
                top: 100%; /* Justo debajo de la barra negra */
                left: 0;
                width: 100%;
                flex-direction: column;
                background-color: #050505; /* Fondo casi negro */
                padding: 0;
                border-bottom: 2px solid #333;
                box-shadow: 0 10px 20px rgba(0,0,0,0.8);
                z-index: 10000; /* Por encima de todo */
            }

            .nav-links.active { display: flex; }

            .nav-links a {
                padding: 15px;
                border-bottom: 1px solid #222;
                width: 100%;
                text-align: center;
                margin: 0 !important;
                font-size: 1rem;
            }

            .btn-logout {
                margin: 15px auto; /* Centrado en el menú */
                display: block;
            }

            .market-grid { 
                grid-template-columns: 1fr; 
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;">
            <i class="fa-solid fa-power-off"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container" style="flex-direction: column; align-items: center; padding-top: 90px;">
        
        <h1 style="color:white; text-transform: uppercase; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-shop"></i> Mercado
        </h1>

        <div style="width: 100%; max-width: 600px; margin-bottom: 25px; padding: 0 15px;">
            <div style="position: relative;">
                <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="buscadorAtleta" placeholder="Buscar atleta..." 
                style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 50px; border: 1px solid #444; background: rgba(0,0,0,0.8); color: white; outline: none;">
            </div>
        </div>

        <div id="mercadoGrid" class="market-grid" style="width: 100%; max-width: 1200px;">
            <p style="color: white; text-align: center; padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </p>
        </div>

    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html';
        }
    </script>

    <script type="module" src="../js/mercado.js"></script>
</body>
</html>
