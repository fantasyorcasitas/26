<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado | Fantasy Track</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>TRACK</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container" style="flex-direction: column; padding-top: 90px;">
        
        <h1 style="color:white; text-transform: uppercase; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-shop"></i> Mercado de Atletas
        </h1>

        <div style="width: 100%; max-width: 1000px; margin-bottom: 20px; padding: 0 20px;">
            <input type="text" id="buscadorAtleta" placeholder="Buscar atleta..." 
            style="width: 100%; padding: 15px; border-radius: 8px; border: none; background: rgba(0,0,0,0.7); color: white; border: 1px solid #444;">
        </div>

        <div id="mercadoGrid" class="market-grid">
            <p style="color: white; text-align: center; grid-column: 1/-1;">Cargando mercado...</p>
        </div>

    </div>

    <script type="module" src="../js/mercado.js"></script>

</html>
