<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================
           1. CORRECCIONES ESTRUCTURALES (SCROLL)
           ========================================= */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        .dashboard-container {
            height: auto !important;
            overflow: visible !important;
            padding-bottom: 100px !important;
        }

        /* =========================================
           2. NUEVO DISEÑO TARJETA (TIPO FANTASY)
           ========================================= */
        
        /* Contenedor de la tarjeta */
        .athlete-card {
            background-color: #151515; /* Negro casi puro */
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Cabecera (Foto + Info) */
        .athlete-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .athlete-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ff5722; /* Naranja Fantasy */
            object-fit: cover;
            background-color: #333;
        }

        .athlete-info {
            display: flex;
            flex-direction: column;
        }

        .athlete-info h3 {
            margin: 0;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
        }

        /* Etiqueta de Categoría (Saltos, Velocidad...) */
        .badge-cat {
            background-color: #333;
            color: #ff5722;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            width: fit-content;
            margin-top: 4px;
        }

        /* Precio grande y verde */
        .price-tag {
            color: #4ade80; 
            font-size: 1.4rem;
            font-weight: 900;
            margin-top: 5px;
        }

        /* =========================================
           3. RESUMEN DE ESTADÍSTICAS (3 COLUMNAS)
           ========================================= */
        .stats-summary {
            display: flex;
            justify-content: space-between;
            background-color: #222;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 33%;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stat-num {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
        }

        /* =========================================
           4. SECCIÓN HISTORIAL DESPLEGABLE
           ========================================= */
        
        /* Botón "Ver historial" */
        .toggle-btn {
            text-align: center;
            color: #ff5722;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 5px;
            margin-top: 5px;
            transition: color 0.2s;
        }
        
        .toggle-btn:hover {
            color: #ff8a65;
            text-decoration: underline;
        }

        /* Contenedor oculto */
        .historial-desplegable {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* La rejilla de 5 columnas para J-4, J-3... */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background-color: #222;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        .grid-value { font-weight: bold; color: white; font-size: 0.9rem; }
        .grid-label { font-size: 0.6rem; color: #777; margin-bottom: 2px; }
        
        .stats-section { margin-top: 10px; width: 100%; }
        .section-label { color: #aaa; font-size: 0.7rem; margin-bottom: 5px; display: block; text-transform: uppercase; font-weight: 600; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           5. RESPONSIVE (MÓVIL)
           ========================================= */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            /* Navbar Móvil */
            .navbar { flex-wrap: wrap; padding: 15px; }
            .nav-logo { flex-grow: 1; }
            .menu-toggle { display: block; margin-left: 15px; }
            
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                margin-top: 15px;
                background: rgba(0, 0, 0, 0.95);
                border-radius: 8px;
                padding: 10px;
                border: 1px solid #333;
            }
            .nav-links.active { display: flex; }
            .nav-links a {
                padding: 15px;
                border-bottom: 1px solid #222;
                text-align: center;
                width: 100%;
                display: block;
            }

            /* Ajustes del Dashboard */
            .dashboard-container { padding-top: 20px !important; }
            h1 { font-size: 1.5rem; }

            .market-grid {
                grid-template-columns: 1fr !important; /* 1 Columna en móvil */
                padding: 0 15px !important;
                gap: 20px;
                display: block; 
            }
            
            .athlete-card { width: 100%; margin-bottom: 20px; }
            #buscadorAtleta { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;">
            <i class="fa-solid fa-power-off"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container" style="flex-direction: column; align-items: center; padding-top: 90px;">
        
        <h1 style="color:white; text-transform: uppercase; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-shop"></i> Mercado
        </h1>

        <div style="width: 100%; max-width: 600px; margin-bottom: 25px; padding: 0 15px;">
            <div style="position: relative;">
                <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="buscadorAtleta" placeholder="Buscar atleta..." 
                style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 50px; border: 1px solid #444; background: rgba(0,0,0,0.8); color: white; outline: none;">
            </div>
        </div>

        <div id="mercadoGrid" class="market-grid" style="width: 100%; max-width: 1200px;">
            <p style="color: white; text-align: center; padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </p>
        </div>

    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html';
        }
    </script>

    <script type="module" src="../js/mercado.js"></script>
</body>
</html>
