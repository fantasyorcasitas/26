<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================
           1. RESET Y ESTRUCTURA BÁSICA
           ========================================= */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
            background-color: #000; /* Fondo negro */
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }

        .dashboard-container {
            height: auto !important;
            padding-bottom: 100px !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           2. BARRA DE NAVEGACIÓN (NAVBAR)
           ========================================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000;
            padding: 15px 30px;
            border-bottom: 2px solid #333;
            width: 100%;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo a {
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-logo span { color: #ff5722; } /* ORCASITAS en naranja */

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #aaa;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ff5722;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #d4af37;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Botón hamburguesa (oculto en PC) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* =========================================
           3. TARJETA DE JUGADOR (DISEÑO FANTASY)
           ========================================= */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .athlete-card {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .athlete-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .athlete-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ff5722;
            object-fit: cover;
            background-color: #222;
        }

        .athlete-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .athlete-info h3 {
            margin: 0;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .badge-cat {
            background-color: #333;
            color: #ff5722;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            width: fit-content;
            margin-top: 5px;
        }

        .price-tag {
            color: #4ade80; 
            font-size: 1.3rem;
            font-weight: 900;
            margin-top: 5px;
        }

        /* ESTADÍSTICAS (Total / Media) */
        .stats-summary {
            display: flex;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 12px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
        }

        .stat-box {
            width: 33%;
            text-align: center;
            border-right: 1px solid #333;
        }
        .stat-box:last-child { border-right: none; }

        .stat-label {
            display: block;
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-num {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        /* BOTÓN HISTORIAL */
        .toggle-btn {
            text-align: center;
            color: #ff5722;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px;
        }
        .toggle-btn:hover { text-decoration: underline; }

        /* DESPLEGABLE */
        .historial-desplegable {
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 15px;
            animation: fadeIn 0.3s;
        }

        .stats-section { margin-bottom: 15px; width: 100%; }
        .section-label { color: #aaa; font-size: 0.7rem; display: block; margin-bottom: 5px; text-transform: uppercase;}
        
        .history-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background-color: #222;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .grid-value { color: white; font-weight: bold; font-size: 0.9rem; }
        .grid-label { color: #666; font-size: 0.6rem; }

        .btn-comprar-mini {
            width: 100%;
            background-color: #eee;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* =========================================
           4. RESPONSIVE (ARREGLO DEL MÓVIL)
           ========================================= */
        @media (max-width: 768px) {
            /* Navbar se adapta */
            .navbar {
                flex-wrap: wrap; 
                padding: 15px;
            }
            
            /* Logo ocupa el espacio izquierdo */
            .nav-logo { flex-grow: 1; }

            /* Aparece el botón menú */
            .menu-toggle { display: block; }
            
            /* Los enlaces se esconden hasta que pulses */
            .nav-links {
                display: none; /* Oculto por defecto */
                width: 100%;
                flex-direction: column;
                margin-top: 15px;
                background-color: #111;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #333;
            }

            /* Clase 'active' (la pone el JS al pulsar) */
            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 10px;
                border-bottom: 1px solid #333;
                width: 100%;
                display: block;
                text-align: center;
            }

            /* Ajustes generales móvil */
            .market-grid { 
                grid-template-columns: 1fr; /* 1 sola columna */
                padding: 10px;
            }
            
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;">
            <i class="fa-solid fa-power-off"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container" style="flex-direction: column; align-items: center; padding-top: 90px;">
        
        <h1 style="color:white; text-transform: uppercase; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-shop"></i> Mercado
        </h1>

        <div style="width: 100%; max-width: 600px; margin-bottom: 25px; padding: 0 15px;">
            <div style="position: relative;">
                <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="buscadorAtleta" placeholder="Buscar atleta..." 
                style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 50px; border: 1px solid #444; background: rgba(0,0,0,0.8); color: white; outline: none;">
            </div>
        </div>

        <div id="mercadoGrid" class="market-grid" style="width: 100%; max-width: 1200px;">
            <p style="color: white; text-align: center; padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </p>
        </div>

    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html';
        }
    </script>

    <script type="module" src="../js/mercado.js"></script>
</body>
</html>
