<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* --- CORRECCIÓN DE SCROLL (IMPORTANTE) --- */
        /* --- PEGA ESTO DENTRO DE TU <STYLE> EN MERCADO.HTML --- */

        /* Estilo de la tarjeta completa */
        .athlete-card {
            background-color: #222; /* Fondo oscuro */
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        
        .athlete-card:hover {
            transform: translateY(-2px);
            border-color: #555;
        }

        /* Cabecera con Foto y Nombre */
        .athlete-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .athlete-img {
            width: 60px;
            height: 60px;
            border-radius: 50%; /* Foto redonda */
            object-fit: cover;
            border: 2px solid #d4af37; /* Borde dorado */
            background-color: #333;
        }

        .athlete-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: white;
            font-weight: 700;
        }

        .athlete-pos {
            margin: 2px 0 0 0;
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
        }

        /* Botón de Fichar */
        .btn-comprar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #d4af37, #f2c94c); /* Dorado */
            border: none;
            border-radius: 8px;
            color: black;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: filter 0.2s;
        }

        .btn-comprar:hover {
            filter: brightness(1.1);
        }
        html, body {
            overflow-y: auto !important; /* Obliga a permitir deslizar verticalmente */
            height: auto !important;
            min-height: 100vh;
        }

        .dashboard-container {
            height: auto !important; /* Que crezca todo lo que necesite */
            overflow: visible !important; 
            padding-bottom: 100px !important; /* Espacio extra abajo para que no se corte el final */
        }
        /* ... TUS ESTILOS ANTERIORES ... */

        .stats-section {
            margin-top: 10px;
            width: 100%;
        }

        .section-label {
            display: block;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 columnas exactas */
            gap: 4px;
            background-color: rgba(255, 255, 255, 0.05); /* Fondo sutil */
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .grid-label {
            font-size: 0.6rem;
            color: #888;
            margin-bottom: 2px;
        }

        .grid-value {
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }

        /* Colores opcionales para valores positivos/negativos */
        .positive { color: #4ade80; } 
        .negative { color: #f87171; }

        /* --- ESTILOS RESPONSIVE (MÓVIL) --- */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            /* NAVBAR */
            .navbar {
                flex-wrap: wrap;
                padding: 15px;
            }
            .nav-logo { flex-grow: 1; }
            .menu-toggle { display: block; margin-left: 15px; }
            
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                margin-top: 15px;
                background: rgba(0, 0, 0, 0.95);
                border-radius: 8px;
                padding: 10px;
                border: 1px solid #333;
            }
            .nav-links.active { display: flex; }
            .nav-links a {
                padding: 15px;
                border-bottom: 1px solid #222;
                text-align: center;
                width: 100%;
                display: block;
            }

            /* CONTENIDO */
            .dashboard-container {
                padding-top: 20px !important;
            }

            h1 { font-size: 1.5rem; }

            /* REJILLA: 1 Columna y márgenes seguros */
            .market-grid {
                grid-template-columns: 1fr !important;
                padding: 0 15px !important;
                gap: 20px;
                display: block; /* A veces block va mejor que grid para scroll en móviles antiguos */
            }
            
            /* Separación entre tarjetas en modo bloque */
            .athlete-card {
                width: 100%;
                margin-bottom: 20px;
            }

            #buscadorAtleta {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;">
            <i class="fa-solid fa-power-off"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container" style="flex-direction: column; align-items: center; padding-top: 90px;">
        
        <h1 style="color:white; text-transform: uppercase; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-shop"></i> Mercado
        </h1>

        <div style="width: 100%; max-width: 600px; margin-bottom: 25px; padding: 0 15px;">
            <div style="position: relative;">
                <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="buscadorAtleta" placeholder="Buscar atleta..." 
                style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 50px; border: 1px solid #444; background: rgba(0,0,0,0.8); color: white; outline: none;">
            </div>
        </div>

        <div id="mercadoGrid" class="market-grid" style="width: 100%; max-width: 1200px;">
            <p style="color: white; text-align: center; padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </p>
        </div>

    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html';
        }
    </script>

    <script type="module" src="../js/mercado.js"></script>
</body>
</html>
