<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado | Fantasy Orcasitas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* ESTILOS ESPECÍFICOS PARA MERCADO */

        /* 1. CONTENEDOR PRINCIPAL */
        .dashboard-container {
            width: 100%;
            padding-top: 20px !important;
            padding-bottom: 100px !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* 2. NAVBAR A PRUEBA DE BOMBAS */
        .navbar {
            position: sticky !important; /* Se pega arriba */
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000 !important;
            padding: 15px 20px !important;
            border-bottom: 2px solid #222 !important;
            z-index: 9999;
            box-sizing: border-box;
            height: auto !important;
        }

        .nav-logo a {
            font-size: 1.2rem;
            font-weight: 800;
            color: white !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-logo span { color: #ff5e00 !important; }

        /* Enlaces de PC */
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #aaa !important;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ff5e00 !important;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #ff5e00 !important;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 15px;
        }

        /* Botón Hamburguesa */
        .menu-toggle {
            display: none !important; 
            background: none;
            border: none;
            color: white !important;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* 3. ESTILOS DE TARJETA Y MERCADO */
        h1 { color: white; margin: 20px 0; text-transform: uppercase; text-align: center; }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            padding: 0 15px;
            box-sizing: border-box;
        }
        
        #buscadorAtleta {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 50px;
            border: 1px solid #444;
            background: #151515;
            color: white;
            outline: none;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .athlete-card {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .athlete-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .athlete-img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #ff5e00; object-fit: cover; background-color: #222; }
        .athlete-info h3 { margin: 0; color: #ffffff; font-size: 1.1rem; font-weight: 800; }
        .badge-cat { background: #333; color: #ff5e00; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-top: 5px; width: fit-content; }
        .price-tag { color: #4ade80; font-size: 1.5rem; font-weight: 900; margin-top: 5px; }

        .stats-summary { display: flex; justify-content: space-between; background: #1a1a1a; padding: 12px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .stat-box { width: 33%; text-align: center; border-right: 1px solid #333; }
        .stat-box:last-child { border-right: none; }
        .stat-label { display: block; font-size: 0.65rem; color: #888; margin-bottom: 3px; }
        .stat-num { font-size: 1.2rem; font-weight: bold; color: #fff; }

        .toggle-btn { text-align: center; color: #ff5e00; font-size: 0.9rem; font-weight: 600; cursor: pointer; padding: 8px; }
        .historial-desplegable { margin-top: 10px; border-top: 1px solid #333; padding-top: 15px; animation: fadeIn 0.3s; }
        .history-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #222; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
        .grid-value { color: white; font-weight: bold; font-size: 0.9rem; }
        .grid-label { color: #666; font-size: 0.6rem; }
        .section-label { color: #aaa; font-size: 0.7rem; display: block; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 4. RESPONSIVE MÓVIL */
        @media (max-width: 768px) {
            .navbar {
                justify-content: space-between;
                padding: 10px 15px !important;
            }
            
            .menu-toggle { display: block !important; }

            /* Menú superpuesto PANTALLA COMPLETA */
            .nav-links {
                position: fixed;
                top: 0; 
                left: 0;
                width: 100%;
                height: 100vh;
                background-color: rgba(0,0,0,0.95);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 11000;
                transform: translateX(100%); 
                transition: transform 0.3s ease-in-out;
            }

            .nav-links.active { transform: translateX(0); }
            .nav-links a { font-size: 1.5rem; margin: 20px 0; color: white !important; display: block; }
            .market-grid { grid-template-columns: 1fr; } 
        }
    </style>
</head>

<body style="display: block !important; height: auto !important; min-height: 100vh; overflow-y: auto !important; background-color: #000 !important; margin: 0; padding: 0;">

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <button class="menu-toggle" onclick="toggleMenu()" style="position: absolute; top: 20px; right: 20px; font-size: 2rem;">
                <i class="fa-solid fa-times"></i>
            </button>

            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>

            <button onclick="cerrarSesion()" class="btn-logout">
                <i class="fa-solid fa-power-off"></i> Salir
            </button>
        </div>
    </nav>

    <div class="dashboard-container">
        <h1><i class="fa-solid fa-shop"></i> Mercado</h1>

        <div class="search-container">
            <div style="position: relative;">
                <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="buscadorAtleta" placeholder="Buscar atleta...">
            </div>
        </div>

        <div id="mercadoGrid" class="market-grid">
            <p style="color: white; text-align: center; padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </p>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html';
        }
    </script>

    <script type="module" src="../js/mercado.js"></script>
</body>
</html>
