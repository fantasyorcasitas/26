<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercado | Fantasy Orcasitas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* CORRECCIÓN DE SCROLL */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
            background-color: #000; /* Fondo de la página negro */
            font-family: 'Montserrat', sans-serif;
        }
        .dashboard-container {
            height: auto !important;
            padding-bottom: 100px !important;
        }

        /* --- TARJETA DE JUGADOR (Estilo Paula Crespo/Sara Amezcua) --- */
        .athlete-card {
            background-color: #151515; /* Gris muy oscuro/Negro */
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* CABECERA: Foto izquierda, Info derecha */
        .athlete-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .athlete-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ff5722; /* El borde naranja de la foto */
            object-fit: cover;
            background-color: #222;
        }

        .athlete-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .athlete-info h3 {
            margin: 0;
            color: #ffffff; /* Nombre en BLANCO */
            font-size: 1.1rem;
            font-weight: 800;
        }

        /* La etiqueta de categoría (ej: VELOCIDAD CORTA) */
        .badge-cat {
            background-color: #333;
            color: #ff5722; /* Texto naranja */
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            width: fit-content;
            margin-top: 5px;
        }

        /* Precio en VERDE GRANDE */
        .price-tag {
            color: #4ade80; 
            font-size: 1.3rem;
            font-weight: 900;
            margin-top: 5px;
        }

        /* --- FILA DE RESUMEN (TOTAL / ÚLTIMA / MEDIA) --- */
        .stats-summary {
            display: flex;
            justify-content: space-between;
            background-color: #1a1a1a; /* Ligeramente diferente al fondo */
            padding: 12px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
        }

        .stat-box {
            width: 33%;
            text-align: center;
            border-right: 1px solid #333; /* Línea separadora vertical */
        }
        .stat-box:last-child { border-right: none; }

        .stat-label {
            display: block;
            font-size: 0.65rem;
            color: #888; /* Gris claro para el título */
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-num {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff; /* Número en BLANCO */
        }

        /* --- BOTÓN DE VER HISTORIAL --- */
        .toggle-btn {
            text-align: center;
            color: #ff5722; /* Naranja */
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px;
            user-select: none;
        }
        .toggle-btn:hover {
            text-decoration: underline;
        }

        /* --- SECCIÓN DESPLEGABLE --- */
        .historial-desplegable {
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 15px;
            animation: fadeIn 0.3s;
        }

        /* Las rejillas de 5 columnas */
        .stats-section { margin-bottom: 15px; }
        .section-label { color: #aaa; font-size: 0.7rem; display: block; margin-bottom: 5px; text-transform: uppercase;}
        
        .history-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background-color: #222;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .grid-value { color: white; font-weight: bold; font-size: 0.9rem; }
        .grid-label { color: #666; font-size: 0.6rem; }

        /* Botón pequeño de fichar dentro del desplegable */
        .btn-comprar-mini {
            width: 100%;
            background-color: #eee;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .market-grid { display: block; padding: 0 15px; }
            .athlete-card { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="home.html" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-person-running"></i> FANTASY <span>ORCASITAS</span>
            </a>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button onclick="cerrarSesion()" class="btn-logout" style="font-size: 1.2rem; margin-left: 10px;">
            <i class="fa-solid fa-power-off"></i>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="home.html">Inicio</a>
            <a href="mi_equipo.html">Mi Equipo</a>
            <a href="mercado.html" class="active">Mercado</a>
            <a href="clasificaciones.html">Ranking</a>
            <a href="calendario.html">Calendario</a>
        </div>
    </nav>

    <div class="dashboard-container" style="flex-direction: column; align-items: center; padding-top: 90px;">
        
        <h1 style="color:white; text-transform: uppercase; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-shop"></i> Mercado
        </h1>

        <div style="width: 100%; max-width: 600px; margin-bottom: 25px; padding: 0 15px;">
            <div style="position: relative;">
                <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="buscadorAtleta" placeholder="Buscar atleta..." 
                style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 50px; border: 1px solid #444; background: rgba(0,0,0,0.8); color: white; outline: none;">
            </div>
        </div>

        <div id="mercadoGrid" class="market-grid" style="width: 100%; max-width: 1200px;">
            <p style="color: white; text-align: center; padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
            </p>
        </div>

    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        function cerrarSesion() {
            localStorage.removeItem('fantasy_user');
            window.location.href = '../index.html';
        }
    </script>

    <script type="module" src="../js/mercado.js"></script>
</body>
</html>
